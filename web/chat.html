<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>self-purify-agent · 自进化对话</title>
<style>
:root{--bg:#0e1116;--side:#141922;--panel:#161b24;--line:#232b38;--txt:#dbe2ec;--dim:#7d8a9c;--acc:#4f8ef7;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--chip:#1d2430}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
/* ── 侧栏 ── */
aside.side{width:264px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:16px 16px 10px;font-weight:700;font-size:15px}
.brand small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:3px}
.newchat{margin:8px 12px;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--acc);color:#fff;font-size:13px;cursor:pointer}
.newchat:hover{filter:brightness(1.1)}
#convs{flex:1;overflow-y:auto;padding:4px 8px}
.conv{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--txt)}
.conv:hover{background:var(--chip)}
.conv.on{background:var(--chip);outline:1px solid var(--line)}
.conv .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .del{visibility:hidden;color:var(--dim);border:none;background:none;cursor:pointer;font-size:12px}
.conv:hover .del{visibility:visible}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.side-foot button,.side-foot a{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px;font-size:12px;cursor:pointer;text-decoration:none;text-align:center}
#llmPill{font-size:11px;color:var(--dim);padding:4px 2px}
#llmPill b{color:var(--ok)}
/* ── 主区 ── */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--side)}
header h1{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:3px 10px;border-radius:12px;background:var(--chip);border:1px solid var(--line);color:var(--dim)}
.pill b{color:var(--acc)}
label.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer}
#messages{flex:1;overflow-y:auto;padding:24px 8px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.msg{margin-bottom:22px;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bub{background:#24457f;color:#eaf1ff;border-radius:14px 14px 4px 14px;padding:11px 14px;max-width:78%;white-space:pre-wrap;font-size:14px;line-height:1.65}
.msg.ai .bub{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.msg.ai .bub code{background:#0d1117;padding:1px 6px;border-radius:5px;font-family:Consolas,monospace;font-size:13px}
.msg.ai .bub pre{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;margin:8px 0;white-space:pre}
.steps{font-size:12px;color:var(--dim);margin-bottom:8px;line-height:1.7}
.steps .cur{color:var(--acc)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:2px 9px;color:var(--dim);cursor:help}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}
.err{color:var(--bad);font-size:13px}
/* 输入区 */
footer{padding:12px 16px 18px;background:var(--bg)}
.inbox{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
textarea{flex:1;background:none;border:none;color:var(--txt);font-size:14px;font-family:inherit;resize:none;outline:none;max-height:160px;line-height:1.5}
#sendBtn{background:var(--acc);border:none;color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;cursor:pointer}
#sendBtn:disabled{opacity:.45;cursor:default}
.hint{max-width:820px;margin:6px auto 0;text-align:center;font-size:11px;color:var(--dim)}
/* 欢迎页 */
#welcome{text-align:center;padding:60px 20px 0}
#welcome h2{font-size:22px;margin-bottom:8px}
#welcome p{color:var(--dim);font-size:13px;margin-bottom:26px}
.exps{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.exp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;cursor:pointer;text-align:left;color:var(--txt)}
.exp:hover{border-color:var(--acc)}
.exp small{display:block;color:var(--dim);margin-top:4px;font-size:11px}
/* ── 进化面板 ── */
aside.evo{width:300px;background:var(--side);border-left:1px solid var(--line);overflow-y:auto;padding:14px;flex-shrink:0;display:none}
aside.evo.open{display:block}
aside.evo h3{font-size:13px;color:#8ab4ff;margin:14px 0 8px}
aside.evo h3:first-child{margin-top:0}
.evo .big{font-size:26px;font-weight:700}
.evo .big small{font-size:12px;color:var(--dim);font-weight:400}
.spark{display:flex;align-items:flex-end;gap:2px;height:36px;margin:6px 0}
.spark i{flex:1;background:#388bfd;min-height:2px;border-radius:1px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #1c2330}
.row b{color:var(--txt)}
.feed{font-size:11px;color:var(--dim);line-height:1.8}
.feed div{border-bottom:1px dashed #1c2330;padding:3px 0}
.note{font-size:11px;color:var(--dim);background:var(--chip);border-radius:8px;padding:8px;line-height:1.6}
/* ── 配置弹窗 ── */
#cfgModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
#cfgModal.open{display:flex}
.cfgbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:420px}
.cfgbox h2{font-size:16px;margin-bottom:4px}
.cfgbox p.sub{font-size:12px;color:var(--dim);margin-bottom:16px}
.cfgbox label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
.cfgbox input{width:100%;background:#0d1117;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px;font-size:13px}
.cfgbtns{display:flex;gap:8px;margin-top:18px}
.cfgbtns button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--txt);cursor:pointer;font-size:13px}
.cfgbtns button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
#cfgTestRes{font-size:12px;margin-top:10px;min-height:16px}
#cfgTestRes.ok{color:var(--ok)}#cfgTestRes.bad{color:var(--bad)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#232b38;border-radius:4px}
</style></head><body>
<div id="app">
  <aside class="side">
    <div class="brand">♻️ self-purify-agent<small>自进化 · 自净化 · 越用越准</small></div>
    <button class="newchat" onclick="newConv()">＋ 新对话</button>
    <div id="convs"></div>
    <div class="side-foot">
      <div id="llmPill">检查配置中…</div>
      <button onclick="openEvo()">📈 进化面板</button>
      <a id="dashLink" href="http://127.0.0.1:3790" target="_blank">🩺 净化观测台</a>
      <button onclick="openCfg()">⚙️ LLM 配置</button>
    </div>
  </aside>

  <main>
    <header>
      <h1 id="convTitle">新对话</h1>
      <span class="pill" id="evoPill">进化 <b>0</b> · 净化 <b>0</b></span>
      <label class="sw"><input type="checkbox" id="quickMode"> 快速模式</label>
    </header>
    <div id="messages"><div class="wrap" id="msgWrap">
      <div id="welcome">
        <h2>开始对话，系统自动进化</h2>
        <p>每一轮对话都会沉淀技能 / 记忆 / 经验；后台持续净化劣质内容——回答会逐步变好</p>
        <div class="exps" id="exps"></div>
      </div>
    </div></div>
    <footer>
      <div class="inbox">
        <textarea id="ta" rows="1" placeholder="输入消息，Enter 发送（Shift+Enter 换行）"></textarea>
        <button id="sendBtn" onclick="doSend()">发送</button>
      </div>
      <div class="hint">对话即任务：规划 → 执行 → 判定 → 沉淀进化 · 劣质内容由净化中枢自动清理</div>
    </footer>
  </main>

  <aside class="evo" id="evoPanel"></aside>

  <div id="cfgModal" onclick="if(event.target===this)closeCfg()">
    <div class="cfgbox">
      <h2>LLM 配置</h2>
      <p class="sub">OpenAI 兼容接口（DeepSeek / 智谱 / 通义 / 自建…），保存后立即生效</p>
      <label>Base URL</label>
      <input id="cfgBase" placeholder="https://api.deepseek.com/v1">
      <label>API Key <span id="cfgKeyMask"></span></label>
      <input id="cfgKey" type="password" placeholder="sk-…（留空保持不变）">
      <label>模型</label>
      <input id="cfgModel" placeholder="deepseek-chat">
      <div class="cfgbtns">
        <button onclick="testCfg()">测试连接</button>
        <button class="primary" onclick="saveCfg()">保存并启用</button>
      </div>
      <div id="cfgTestRes"></div>
    </div>
  </div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={convs:[],convId:null,sending:false,evoOpen:false};

const EXAMPLES=[
  ['帮我总结 node:sqlite 的核心用法','沉淀为技能，下次同类问题直接复用'],
  ['写一个防抖函数并解释','执行轨迹会生成可复用经验'],
  ['今天记住：项目用 Node 22 部署','写入记忆，冲突时自动消解'],
  ['继续优化刚才的方案','多轮上下文 + 已进化能力'],
];

/* ── markdown-lite ── */
function md(s){
  s=esc(s);
  s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>'<pre>'+c.replace(/\n$/,'')+'</pre>');
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\n/g,'<br>');
  return s;
}

/* ── 初始化 ── */
async function init(){
  $('exps').innerHTML=EXAMPLES.map((e,i)=>`<button class="exp" onclick="useExample(${i})">${esc(e[0])}<small>${esc(e[1])}</small></button>`).join('');
  await refreshConvs();
  await refreshLlmPill();
  setInterval(refreshEvoPill,5000);
  if(state.evoOpen)refreshEvo();
  $('ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});
  $('ta').addEventListener('input',()=>{const t=$('ta');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px';});
}

async function refreshConvs(){
  state.convs=await (await fetch('/api/conversations')).json();
  $('convs').innerHTML=state.convs.map(c=>
    `<div class="conv ${c.id===state.convId?'on':''}" onclick="loadConv('${c.id}')"><span class="t" title="${esc(c.title)}">${esc(c.title)}</span><button class="del" onclick="event.stopPropagation();delConv('${c.id}')">✕</button></div>`
  ).join('')||'<div style="color:var(--dim);font-size:12px;padding:12px">暂无对话</div>';
}
async function refreshLlmPill(){
  const c=await (await fetch('/api/config')).json();
  $('llmPill').innerHTML=c.mock?'🧪 <b>MOCK 离线模式</b>（零 API 成本）':(c.configured?`✅ 已连接 <b>${esc(c.model)}</b>`:'⚠️ 未配置 API Key —— 点下方 ⚙️ 配置');
}
async function refreshEvoPill(){
  const s=await (await fetch('/api/state')).json();
  const pur=s.purify.funnel.QUARANTINE??0;
  $('evoPill').innerHTML=`技能 <b>${s.entities.skill.count}</b> · 记忆 <b>${s.entities.memory.count}</b> · 净化 <b>${pur}</b>`;
}

/* ── 会话 ── */
async function newConv(){state.convId=null;$('msgWrap').innerHTML=document.createElement('div').innerHTML;$('messages').scrollTop=0;
  location.reload();
}
async function loadConv(id){
  state.convId=id;
  const msgs=await (await fetch(`/api/conversations/${id}/messages`)).json();
  $('msgWrap').innerHTML='<div id="thread"></div>';
  for(const m of msgs)renderMsg(m);
  const conv=state.convs.find(c=>c.id===id);
  $('convTitle').textContent=conv?conv.title:'对话';
  refreshConvs();
}
async function delConv(id){await fetch(`/api/conversations/${id}`,{method:'DELETE'});if(state.convId===id)newConv();else refreshConvs();}
function useExample(i){$('ta').value=EXAMPLES[i][0];doSend();}

/* ── 消息渲染 ── */
function renderMsg(m){
  $('welcome')?.remove();
  const t=$('thread')||((el=>{el.id='thread';$('msgWrap').appendChild(el);return el;})(document.createElement('div')));
  if(m.role==='user'){
    const d=document.createElement('div');d.className='msg user';
    d.innerHTML=`<div class="bub">${esc(m.content)}</div>`;t.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='msg ai';
    d.innerHTML=aiHtml(m.meta?.thinking||'',m.content,m.meta);
    t.appendChild(d);
  }
  $('messages').scrollTop=$('messages').scrollHeight;
}
function aiHtml(thinking,content,meta){
  const m=meta||{};
  let chips='';
  const u=m.contextUsed||{skills:[],memories:[],experiences:[]};
  if(m.outcome)chips+=`<span class="chip ${m.outcome==='SUCCESS'?'ok':'bad'}" title="判定器双采样一致判定：${esc(m.basis)}">${m.outcome==='SUCCESS'?'✅ 完成':'❌ 失败'}</span>`;
  if(u.skills?.length)chips+=`<span class="chip" title="${esc(u.skills.map(x=>x.name+' (Q='+x.q+')').join('\n'))}">🛠 复用技能 ×${u.skills.length}</span>`;
  if(u.memories?.length)chips+=`<span class="chip" title="${esc(u.memories.map(x=>x.excerpt).join('\n'))}">🧠 记忆 ×${u.memories.length}</span>`;
  if(u.experiences?.length)chips+=`<span class="chip" title="${esc(u.experiences.map(x=>x.summary).join('\n'))}">📚 经验 ×${u.experiences.length}</span>`;
  if(m.quick)chips+='<span class="chip">⚡ 快速</span>';
  if(m.durationMs!=null)chips+=`<span class="chip" title="本轮任务耗时">${(m.durationMs/1000).toFixed(1)}s</span>`;
  const steps=thinking?`<div class="steps">${thinking}</div>`:'';
  const body=m.error&&!content?`<span class="err">${esc(m.error)}</span>`:md(content);
  return `<div class="bub">${steps}${body}</div>${chips?`<div class="meta">${chips}</div>`:''}`;
}

/* ── 发送（NDJSON 流式）── */
async function doSend(){
  const content=$('ta').value.trim();
  if(!content||state.sending)return;
  state.sending=true;$('sendBtn').disabled=true;$('ta').value='';$('ta').style.height='auto';
  renderMsg({role:'user',content});
  const d=document.createElement('div');d.className='msg ai';
  const wrap=($('thread')||(() =>{const el=document.createElement('div');el.id='thread';$('msgWrap').appendChild(el);return el;})());
  wrap.appendChild(d);
  let thinking='',meta={};
  const setAi=()=>{d.innerHTML=aiHtml(thinking,'',null);};
  setAi();
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:state.convId,content,quick:$('quickMode').checked})});
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line)continue;
        const evt=JSON.parse(line);
        if(evt.type==='conversation'){
          if(!state.convId){state.convId=evt.conversation.id;$('convTitle').textContent=evt.conversation.title;}
        }else if(evt.type==='stage'){
          if(evt.stage==='start')thinking=`<div class="cur">正在接收任务…</div>`;
          else if(evt.stage==='plan')thinking=`🧭 规划：${esc(evt.steps.join(' → '))}<br><span class="cur">开始执行…</span>`;
          else if(evt.stage==='step')thinking+=`<br>⚙️ 步骤 ${evt.idx}/${evt.total}：${esc(evt.goal)}`;
          else if(evt.stage==='answer')thinking+=`<br><span class="cur">✍️ ${esc(evt.label||'综合回答')}…</span>`;
          setAi();$('messages').scrollTop=$('messages').scrollHeight;
        }else if(evt.type==='done'){
          meta=evt.message.meta||{};meta.thinking=thinking;
          d.innerHTML=aiHtml(thinking,evt.message.content,meta);
          $('messages').scrollTop=$('messages').scrollHeight;
          refreshEvoPill();
        }else if(evt.type==='error'){
          d.innerHTML=`<div class="bub"><span class="err">⚠️ ${esc(evt.error)}</span></div>`;
        }
      }
    }
  }catch(e){
    d.innerHTML=`<div class="bub"><span class="err">网络错误：${esc(e.message)}</span></div>`;
  }
  state.sending=false;$('sendBtn').disabled=false;$('ta').focus();
  refreshConvs();
  if(state.evoOpen)refreshEvo();
}

/* ── 配置 ── */
async function openCfg(){
  const c=await (await fetch('/api/config')).json();
  $('cfgBase').value=c.baseUrl||'';$('cfgModel').value=c.model||'';
  $('cfgKey').value='';$('cfgKeyMask').textContent=c.apiKeyMasked?`（当前 ${c.apiKeyMasked}）`:'';
  $('cfgTestRes').textContent='';$('cfgModal').classList.add('open');
}
function closeCfg(){$('cfgModal').classList.remove('open');}
async function testCfg(){
  $('cfgTestRes').className='';$('cfgTestRes').textContent='测试中…';
  const r=await (await fetch('/api/config/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({baseUrl:$('cfgBase').value.trim(),apiKey:$('cfgKey').value.trim()||undefined,model:$('cfgModel').value.trim()})})).json();
  if(r.ok){$('cfgTestRes').className='ok';$('cfgTestRes').textContent=`✅ 连接成功（${r.latencyMs}ms${r.reply?' · '+r.reply:''}）`;}
  else{$('cfgTestRes').className='bad';$('cfgTestRes').textContent='❌ '+r.error;}
}
async function saveCfg(){
  const b={baseUrl:$('cfgBase').value.trim(),model:$('cfgModel').value.trim()};
  const k=$('cfgKey').value.trim();if(k)b.apiKey=k;
  const r=await (await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();
  if(r.error){$('cfgTestRes').className='bad';$('cfgTestRes').textContent='❌ '+r.error;return;}
  closeCfg();refreshLlmPill();
}

/* ── 进化面板 ── */
function openEvo(){state.evoOpen=!state.evoOpen;$('evoPanel').classList.toggle('open',state.evoOpen);if(state.evoOpen)refreshEvo();}
async function refreshEvo(){
  const s=await (await fetch('/api/state')).json();
  const spark=(arr,color)=>arr.length?`<div class="spark">${arr.map(v=>`<i style="height:${Math.max(4,Math.abs(v)*(color==='blue'?36:36)+4)}px;background:${v<0?'#f85149':color==='blue'?'#388bfd':'#3fb950'}"></i>`).join('')}</div>`:'<div class="feed">暂无数据（先发起几轮对话）</div>';
  const rate=s.tasks.last20.length?Math.round(s.tasks.last20.reduce((a,b)=>a+b,0)/s.tasks.last20.length*100):null;
  const pf=s.purify.funnel;
  const totalPur=Object.values(pf).reduce((a,b)=>a+b,0);
  $('evoPanel').innerHTML=`
  <h3>🎯 近 20 轮成功率</h3>
  <div class="big">${rate==null?'—':rate+'%'}<small>（全部 ${s.tasks.total} 轮：${s.tasks.allRate==null?'—':Math.round(s.tasks.allRate*100)+'%'}）</small></div>
  ${spark(s.tasks.last20,'blue')}
  <h3>📦 已进化能力</h3>
  <div class="row"><span>技能（经门禁验证）</span><b>${s.entities.skill.count} 个 · 均Q ${s.entities.skill.avgQ??'—'}</b></div>
  <div class="row"><span>记忆</span><b>${s.entities.memory.count} 条 · 均Q ${s.entities.memory.avgQ??'—'}</b></div>
  <div class="row"><span>经验（带证据链）</span><b>${s.entities.experience.count} 条 · 均Q ${s.entities.experience.avgQ??'—'}</b></div>
  <div class="row"><span>黄金任务集</span><b>${s.golden} 条</b></div>
  <h3>🧹 净化（清理劣质/冗余）</h3>
  <div class="row"><span>隔离</span><b>${pf.QUARANTINE??0}</b></div>
  <div class="row"><span>合并去重</span><b>${(pf.MERGE??0)+(pf.EXPIRE??0)}</b></div>
  <div class="row"><span>复审翻案率</span><b>${s.purify.review.overturnRate??'—'}（${s.purify.review.sampled} 样本）</b></div>
  <div class="row"><span>墓碑（防劣质复活）</span><b>${s.purify.tombstones}</b></div>
  <div class="row"><span>硬清除</span><b>${pf.PURGE??0}</b></div>
  <h3>📉 净利率（稳态 ≈ 0）</h3>${spark(s.purify.netRateHistory,'green')}
  ${s.tuned?`<h3>🎚 自动调参</h3><div class="row"><span>检索权重</span><b>${JSON.stringify(s.tuned)}</b></div>`:''}
  <h3>🕐 最近净化事件</h3>
  <div class="feed">${s.purify.recent.map(l=>`<div>[${new Date(l.at).toLocaleTimeString()}] ${l.action} ${l.dimension} ${l.entity}… ${esc(l.reason)}</div>`).join('')||'暂无（后台每 10 分钟轻量净化 + 每日深度净化）'}</div>
  <h3>💡 为什么会越用越好</h3>
  <div class="note">每轮对话：✅ 沉淀高价值记忆 → 📚 复盘出带证据的经验 → 🛠 提炼技能（需过黄金集门禁才上线）。后台净化中枢持续清理过期/冗余/劣质内容（先隔离 30 天可回滚，绝不误删），被复用越多的能力质量分越高、排序越靠前——所以回答会逐步变好。</div>
  <h3>💰 今日用量</h3>
  <div class="row"><span>tokens</span><b>${(s.usage.in+s.usage.out).toLocaleString()} / ${s.usage.budget.toLocaleString()}</b></div>`;
}

init();
</script></body></html>
