<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>evo-agent · 自进化智能体</title>
<style>
:root{--bg:#212121;--side:#171717;--panel:#2f2f2f;--line:#3a3a3a;--txt:#ececec;--dim:#9b9b9b;--acc:#10a37f;--ok:#10a37f;--bad:#ef4444;--warn:#d29922;--chip:#1f1f1f;--userbub:#2f2f2f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
/* ── 侧栏：ChatGPT 式深色极简 ── */
aside.side{width:260px;background:var(--side);display:flex;flex-direction:column;flex-shrink:0;transition:margin-left .2s}
aside.side.collapsed{margin-left:-260px}
.brand{padding:14px 16px 6px;font-weight:600;font-size:14px;color:var(--txt)}
.brand small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:2px}
.newchat{margin:8px 12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--txt);font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.newchat:hover{background:var(--panel)}
#convs{flex:1;overflow-y:auto;padding:2px 8px}
.conv{padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--txt)}
.conv:hover{background:var(--panel)}
.conv.on{background:var(--panel)}
.conv .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .del{visibility:hidden;color:var(--dim);border:none;background:none;cursor:pointer;font-size:12px}
.conv:hover .del{visibility:visible}
.side-foot{border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.side-foot button{background:none;color:var(--txt);border:none;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.side-foot button:hover{background:var(--panel)}
#llmPill{font-size:11px;color:var(--dim);padding:4px 10px}
#llmPill b{color:var(--ok)}
/* ── 主区 ── */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg)}
#sidebarToggle{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;padding:4px 8px;border-radius:8px}
#sidebarToggle:hover{background:var(--panel);color:var(--txt)}
header h1{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:3px 10px;border-radius:12px;background:var(--chip);border:1px solid var(--line);color:var(--dim)}
.pill b{color:var(--acc)}
label.sw{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);cursor:pointer}
#messages{flex:1;overflow-y:auto;padding:24px 8px 8px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.msg{margin-bottom:26px;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
/* ChatGPT 式：用户右侧气泡 / AI 全宽无气泡 */
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bub{background:var(--userbub);border-radius:18px 18px 4px 18px;padding:11px 16px;max-width:75%;white-space:pre-wrap;font-size:15px;line-height:1.7}
.msg.ai{display:flex;gap:12px}
.ai-av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px}
.msg.ai .body{flex:1;min-width:0}
.msg.ai .bub{font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.msg.ai .bub code{background:#1a1a1a;padding:1px 6px;border-radius:5px;font-family:Consolas,monospace;font-size:13px}
.msg.ai .bub pre{background:#1a1a1a;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0;white-space:pre;font-size:13px}
/* 执行过程卡片：可折叠实时动作区 */
.exec{background:var(--chip);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exec-h{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.exec-h .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);animation:pulse 1.2s infinite}
.exec.done .exec-h .dot{background:var(--ok);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.exec-b{padding:2px 12px 10px;font-size:12px;color:var(--dim);line-height:2}
.exec-b .ln{display:flex;gap:6px;align-items:baseline}
.exec-b .ln.done{color:#6b7f74}
.exec-b .ln.cur{color:var(--txt)}
.exec-b .ln .tick{color:var(--ok)}
.exec-b .ln .spin{display:inline-block;animation:pulse 1s infinite;color:var(--acc)}
.exec-b .prev{color:#7a7a7a;font-size:11px;margin-left:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%;display:block}
.exec-b .warn-ln{color:var(--warn)}
.exec-b .timer{margin-left:auto;font-size:11px;color:#6b6b6b;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:2px 9px;color:var(--dim);cursor:help}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}
.err{color:var(--bad);font-size:14px}
/* 输入区：ChatGPT 式大圆角输入框 + 圆形发送 */
footer{padding:8px 16px 16px;background:var(--bg)}
.inbox{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:12px 14px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.inbox:focus-within{border-color:#5a5a5a}
textarea{flex:1;background:none;border:none;color:var(--txt);font-size:15px;font-family:inherit;resize:none;outline:none;max-height:180px;line-height:1.55}
#sendBtn{width:34px;height:34px;border-radius:50%;border:none;background:var(--acc);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
#sendBtn:disabled{opacity:.35;cursor:default}
#sendBtn:not(:disabled):hover{filter:brightness(1.15)}
.hint{max-width:760px;margin:6px auto 0;text-align:center;font-size:11px;color:var(--dim)}
/* 欢迎页 */
#welcome{text-align:center;padding:48px 20px 0}
#welcome .logo{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
#welcome h2{font-size:24px;margin-bottom:8px;font-weight:600}
#welcome p{color:var(--dim);font-size:13px;margin-bottom:28px}
.exps{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:540px;margin:0 auto}
.exp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13px;cursor:pointer;text-align:left;color:var(--txt);transition:border-color .15s}
.exp:hover{border-color:var(--acc)}
.exp small{display:block;color:var(--dim);margin-top:4px;font-size:11px}
/* ── 进化面板 ── */
aside.evo{width:320px;background:var(--side);border-left:1px solid var(--line);overflow-y:auto;padding:16px;flex-shrink:0;display:none}
aside.evo.open{display:block}
aside.evo h3{font-size:12px;color:var(--dim);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px}
aside.evo h3:first-child{margin-top:0}
.evo .big{font-size:28px;font-weight:700}
.evo .big small{font-size:12px;color:var(--dim);font-weight:400}
.spark{display:flex;align-items:flex-end;gap:2px;height:36px;margin:6px 0}
.spark i{flex:1;background:var(--acc);min-height:2px;border-radius:1px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid #262626}
.row b{color:var(--txt)}
.feed{font-size:11px;color:var(--dim);line-height:1.8}
.feed div{border-bottom:1px dashed #262626;padding:3px 0}
.note{font-size:11px;color:var(--dim);background:var(--chip);border-radius:10px;padding:9px;line-height:1.7}
.sharebox{display:flex;gap:6px;margin-top:8px}
.sharebox button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font-size:12px}
.sharebox button:hover{border-color:var(--acc)}
/* ── 弹窗（配置/导入）── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}
.modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:440px;max-height:85vh;overflow-y:auto}
.mbox h2{font-size:16px;margin-bottom:4px}
.mbox p.sub{font-size:12px;color:var(--dim);margin-bottom:16px}
.mbox label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
.mbox input,.mbox textarea{width:100%;background:#141414;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:9px;font-size:13px}
.mbox textarea{min-height:120px;resize:vertical;font-family:Consolas,monospace;font-size:11px}
.mbtns{display:flex;gap:8px;margin-top:18px}
.mbtns button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--txt);cursor:pointer;font-size:13px}
.mbtns button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.mbtns button.primary:hover{filter:brightness(1.1)}
.mbtns button:hover{border-color:#5a5a5a}
#cfgTestRes,#impRes{font-size:12px;margin-top:10px;min-height:16px;line-height:1.6}
#cfgTestRes.ok,#impRes.ok{color:var(--ok)}#cfgTestRes.bad,#impRes.bad{color:var(--bad)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#4a4a4a}
</style></head><body>
<div id="app">
  <aside class="side" id="sidebar">
    <div class="brand">♻ evo-agent<small>自进化智能体 · 越用越准</small></div>
    <button class="newchat" onclick="newConv()">✏ 新对话</button>
    <div id="convs"></div>
    <div class="side-foot">
      <div id="llmPill">检查配置中…</div>
      <button onclick="openEvo()">📈 进化面板</button>
      <button onclick="openCfg()">⚙ LLM 配置</button>
    </div>
  </aside>

  <main>
    <header>
      <button id="sidebarToggle" onclick="toggleSidebar()" title="侧栏">☰</button>
      <h1 id="convTitle">新对话</h1>
      <span class="pill" id="evoPill" onclick="openEvo()" style="cursor:pointer">技能 <b>0</b> · 记忆 <b>0</b> · 经验 <b>0</b></span>
      <label class="sw"><input type="checkbox" id="quickMode"> ⚡快速</label>
    </header>
    <div id="messages"><div class="wrap" id="msgWrap">
      <div id="welcome">
        <div class="logo">♻</div>
        <h2>有什么可以帮忙？</h2>
        <p>每轮对话自动沉淀技能 / 记忆 / 经验，能力持续积累</p>
        <div class="exps" id="exps"></div>
      </div>
    </div></div>
    <footer>
      <div class="inbox">
        <textarea id="ta" rows="1" placeholder="输入消息…"></textarea>
        <button id="sendBtn" onclick="doSend()" title="发送">↑</button>
      </div>
      <div class="hint">对话即任务 · 规划 → 执行 → 判定 → 沉淀进化</div>
    </footer>
  </main>

  <aside class="evo" id="evoPanel"></aside>

  <div class="modal" id="cfgModal" onclick="if(event.target===this)closeModal('cfgModal')">
    <div class="mbox">
      <h2>LLM 配置</h2>
      <p class="sub">OpenAI 兼容接口（DeepSeek / 智谱 / 通义 / 自建…），保存即生效</p>
      <label>Base URL</label>
      <input id="cfgBase" placeholder="https://api.deepseek.com/v1">
      <label>API Key <span id="cfgKeyMask"></span></label>
      <input id="cfgKey" type="password" placeholder="sk-…（留空保持不变）">
      <label>模型</label>
      <input id="cfgModel" placeholder="deepseek-chat">
      <div class="mbtns">
        <button onclick="testCfg()">测试连接</button>
        <button class="primary" onclick="saveCfg()">保存并启用</button>
      </div>
      <div id="cfgTestRes"></div>
    </div>
  </div>

  <div class="modal" id="impModal" onclick="if(event.target===this)closeModal('impModal')">
    <div class="mbox">
      <h2>导入能力包</h2>
      <p class="sub">粘贴他人分享的能力包 JSON（或选择文件），技能以草稿入库（须过黄金门禁才生效），记忆/经验去重后直接激活</p>
      <input type="file" id="impFile" accept=".json" style="margin-bottom:8px">
      <label>能力包内容</label>
      <textarea id="impText" placeholder='{"format":"evo-agent-share","items":[…]}'></textarea>
      <div class="mbtns">
        <button onclick="closeModal('impModal')">取消</button>
        <button class="primary" onclick="doImport()">导入</button>
      </div>
      <div id="impRes"></div>
    </div>
  </div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={convs:[],convId:null,sending:false,evoOpen:false};

const EXAMPLES=[
  ['搜索最近的 AI 新闻并总结','联网获取实时信息'],
  ['计算 (1+0.06)^20 * 50000 复利终值','精确计算 + 代码验证'],
  ['今天记住：项目用 Node 22 部署','写入记忆，越用越准'],
  ['帮我调研一个技术选型问题','多步任务 · 全程进度可见'],
];

/* ── markdown-lite ── */
function md(s){
  s=esc(s);
  s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>'<pre>'+c.replace(/\n$/,'')+'</pre>');
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/^### (.+)$/gm,'<b>$1</b>');
  s=s.replace(/\n/g,'<br>');
  return s;
}

/* ── 初始化 ── */
async function init(){
  $('exps').innerHTML=EXAMPLES.map((e,i)=>`<button class="exp" onclick="useExample(${i})">${esc(e[0])}<small>${esc(e[1])}</small></button>`).join('');
  await refreshConvs();
  await refreshLlmPill();
  setInterval(refreshEvoPill,5000);
  $('ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});
  $('ta').addEventListener('input',()=>{const t=$('ta');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px';});
  $('impFile').addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    $('impText').value=await f.text();
  });
}
async function refreshConvs(){
  state.convs=await (await fetch('/api/conversations')).json();
  $('convs').innerHTML=state.convs.map(c=>
    `<div class="conv ${c.id===state.convId?'on':''}" onclick="loadConv('${c.id}')"><span class="t" title="${esc(c.title)}">${esc(c.title)}</span><button class="del" onclick="event.stopPropagation();delConv('${c.id}')">✕</button></div>`
  ).join('')||'<div style="color:var(--dim);font-size:12px;padding:12px">暂无对话</div>';
}
async function refreshLlmPill(){
  const c=await (await fetch('/api/config')).json();
  $('llmPill').innerHTML=c.mock?'🧪 <b>MOCK 离线模式</b>':(c.configured?`✅ 已连接 <b>${esc(c.model)}</b>`:'⚠ 未配置 —— 点「LLM 配置」');
}
async function refreshEvoPill(){
  const s=await (await fetch('/api/state')).json();
  $('evoPill').innerHTML=`技能 <b>${s.entities.skill.count}</b> · 记忆 <b>${s.entities.memory.count}</b> · 经验 <b>${s.entities.experience.count}</b>`;
}

/* ── 会话 ── */
async function newConv(){state.convId=null;location.reload();}
async function loadConv(id){
  state.convId=id;
  const msgs=await (await fetch(`/api/conversations/${id}/messages`)).json();
  $('msgWrap').innerHTML='<div id="thread"></div>';
  for(const m of msgs)renderMsg(m);
  const conv=state.convs.find(c=>c.id===id);
  $('convTitle').textContent=conv?conv.title:'对话';
  refreshConvs();
}
async function delConv(id){await fetch(`/api/conversations/${id}`,{method:'DELETE'});if(state.convId===id)newConv();else refreshConvs();}
function useExample(i){$('ta').value=EXAMPLES[i][0];doSend();}
function closeModal(id){$(id).classList.remove('open');}

/* ── 消息渲染 ── */
function renderMsg(m){
  $('welcome')?.remove();
  const t=$('thread')||((el=>{el.id='thread';$('msgWrap').appendChild(el);return el;})(document.createElement('div')));
  if(m.role==='user'){
    const d=document.createElement('div');d.className='msg user';
    d.innerHTML=`<div class="bub">${esc(m.content)}</div>`;t.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='msg ai';
    d.innerHTML=`<div class="ai-av">♻</div><div class="body">${aiHtml(m.meta?.thinkingHtml||m.meta?.thinking||'',m.content,m.meta)}</div>`;
    t.appendChild(d);
  }
  $('messages').scrollTop=$('messages').scrollHeight;
}
function aiHtml(thinking,content,meta){
  const m=meta||{};
  let chips='';
  const u=m.contextUsed||{skills:[],memories:[],experiences:[]};
  if(m.outcome)chips+=`<span class="chip ${m.outcome==='SUCCESS'?'ok':'bad'}" title="判定依据：${esc(m.basis)}">${m.outcome==='SUCCESS'?'✓ 完成':'✗ 失败'}</span>`;
  if(u.skills?.length)chips+=`<span class="chip" title="${esc(u.skills.map(x=>x.name+' (Q='+x.q+')').join('\n'))}">🛠 技能 ×${u.skills.length}</span>`;
  if(u.memories?.length)chips+=`<span class="chip" title="${esc(u.memories.map(x=>x.excerpt).join('\n'))}">🧠 记忆 ×${u.memories.length}</span>`;
  if(u.experiences?.length)chips+=`<span class="chip" title="${esc(u.experiences.map(x=>x.summary).join('\n'))}">📚 经验 ×${u.experiences.length}</span>`;
  if(m.quick)chips+='<span class="chip">⚡ 快速</span>';
  if(m.durationMs!=null)chips+=`<span class="chip">${(m.durationMs/1000).toFixed(1)}s</span>`;
  const exec=thinking?`<div class="exec done"><div class="exec-h"><span class="dot"></span>执行过程</div><div class="exec-b">${thinking}</div></div>`:'';
  const body=m.error&&!content?`<span class="err">${esc(m.error)}</span>`:md(content);
  return `${exec}<div class="bub">${body}</div>${chips?`<div class="meta">${chips}</div>`:''}`;
}

/* ── 实时执行渲染器：行级 DOM 增量更新（当前动作高亮 + 跳动计时）── */
function makeExecView(container){
  container.innerHTML=`<div class="exec"><div class="exec-h"><span class="dot"></span><span class="exec-title">正在思考…</span><span class="timer"></span></div><div class="exec-b" style="display:none"></div></div>`;
  const box=container.querySelector('.exec'),body=container.querySelector('.exec-b'),
        title=container.querySelector('.exec-title'),timerEl=container.querySelector('.timer');
  let curLine=null,curStart=0,timerId=null,elapsed=0;
  const scrollTop=()=>{const m=$('messages');m.scrollTop=m.scrollHeight;};
  const startTimer=()=>{curStart=Date.now();timerId=setInterval(()=>{timerEl.textContent=((Date.now()-curStart)/1000).toFixed(0)+'s';},500);};
  const stopTimer=()=>{if(timerId){clearInterval(timerId);timerId='';}timerEl.textContent=elapsed?((elapsed/1000).toFixed(1)+'s'):'';};
  return {
    set(t){title.textContent=t;},
    plan(steps){
      body.style.display='';
      const d=document.createElement('div');d.className='ln';d.innerHTML=`<span class="tick">🧭</span><span>规划：${esc(steps.map(s=>String(s).slice(0,26)).join(' → '))}</span>`;
      body.appendChild(d);this.cur("执行中…");scrollTop();
    },
    cur(label){
      if(curLine){this.finishLine();}
      const d=document.createElement('div');d.className='ln cur';d.id='curln';
      d.innerHTML=`<span class="spin">●</span><span>${esc(label)}</span>`;
      body.appendChild(d);curLine=d;startTimer();scrollTop();
    },
    finishLine(preview){
      if(!curLine)return;
      curLine.className='ln done';
      const lbl=curLine.querySelector('span:last-child').textContent;
      curLine.innerHTML=`<span class="tick">✓</span><span>${esc(lbl)}</span>`;
      if(preview){const p=document.createElement('span');p.className='prev';p.textContent=preview+' …';body.appendChild(p);}
      curLine=null;if(timerId){clearInterval(timerId);timerId=null;}
    },
    warn(t){const d=document.createElement('div');d.className='ln warn-ln';d.innerHTML=`<span>⚠</span><span>${esc(t)}</span>`;body.appendChild(d);scrollTop();},
    info(emoji,t){const d=document.createElement('div');d.className='ln';d.innerHTML=`<span>${emoji}</span><span>${esc(t)}</span>`;body.appendChild(d);scrollTop();},
    done(){this.finishLine();box.classList.add('done');title.textContent='执行过程';stopTimer();},
    html(){return body.style.display==='none'?'':`<div class="exec done"><div class="exec-h"><span class="dot"></span>执行过程</div><div class="exec-b">${body.innerHTML}</div></div>`;},
  };
}

/* ── 发送（NDJSON 流式 + 实时动作 + 断线恢复）── */
async function doSend(){
  const content=$('ta').value.trim();
  if(!content||state.sending)return;
  state.sending=true;$('sendBtn').disabled=true;$('ta').value='';$('ta').style.height='auto';
  renderMsg({role:'user',content});
  $('welcome')?.remove();
  const d=document.createElement('div');d.className='msg ai';
  const wrap=($('thread')||(() =>{const el=document.createElement('div');el.id='thread';$('msgWrap').appendChild(el);return el;})());
  wrap.appendChild(d);
  d.innerHTML=`<div class="ai-av">♻</div><div class="body"></div>`;
  const body=d.querySelector('.body');
  const view=makeExecView(body);
  let meta={},taskId=null;
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:state.convId,content,quick:$('quickMode').checked})});
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line)continue;
        const evt=JSON.parse(line);
        if(evt.type==='conversation'){
          if(!state.convId){state.convId=evt.conversation.id;$('convTitle').textContent=evt.conversation.title;}
        }else if(evt.type==='stage'){
          if(evt.stage==='start'){view.set('正在接收任务…');if(evt.taskId)taskId=evt.taskId;}
          else if(evt.stage==='plan'){view.set('已规划 '+evt.steps.length+' 个步骤');view.plan(evt.steps);}
          else if(evt.stage==='replan'){view.warn(`重新规划（第 ${evt.attempt} 次）：${evt.reason||''}`);}
          else if(evt.stage==='step'){view.cur(`步骤 ${evt.idx}/${evt.total}：${evt.goal}`);}
          else if(evt.stage==='retry'){view.warn(`参数修正重试：${evt.error||''}`);}
          else if(evt.stage==='degrade'){view.warn(`「${evt.goal||''}」降级为自身推理（${evt.reason||''}）`);}
          else if(evt.stage==='step_done'){view.finishLine(evt.preview);}
          else if(evt.stage==='answer'){view.set('生成最终回答…');view.cur(evt.label||'综合回答');}
        }else if(evt.type==='done'){
          view.done();
          meta=evt.message.meta||{};meta.thinkingHtml=view.html();
          body.innerHTML=aiHtml(view.html(),evt.message.content,meta);
          $('messages').scrollTop=$('messages').scrollHeight;
          refreshEvoPill();
        }else if(evt.type==='error'){
          view.done();body.innerHTML=`<span class="err">⚠ ${esc(evt.error)}</span>`;
        }
      }
    }
  }catch(e){
    if(taskId){
      view.warn('网络中断，等待服务端完成后自动恢复…');
      const deadline=Date.now()+8*60*1000;
      try{
        while(Date.now()<deadline){
          await new Promise(r=>setTimeout(r,3000));
          const q=await (await fetch('/api/task/'+taskId)).json();
          if(q.status==='done'){
            view.done();meta=q.meta||{};meta.thinkingHtml=view.html();
            body.innerHTML=aiHtml(view.html(),q.answer||('（任务失败：'+(q.error||'未知')+'）'),{...meta,outcome:q.outcome,basis:q.basis,durationMs:q.durationMs});
            break;
          }
        }
      }catch(_){/* 保留提示 */}
    }else{
      view.done();body.innerHTML=`<span class="err">网络错误：${esc(e.message)}</span>`;
    }
  }
  state.sending=false;$('sendBtn').disabled=false;$('ta').focus();
  refreshConvs();
  if(state.evoOpen)refreshEvo();
}

/* ── 配置 ── */
async function openCfg(){
  const c=await (await fetch('/api/config')).json();
  $('cfgBase').value=c.baseUrl||'';$('cfgModel').value=c.model||'';
  $('cfgKey').value='';$('cfgKeyMask').textContent=c.apiKeyMasked?`（当前 ${c.apiKeyMasked}）`:'';
  $('cfgTestRes').textContent='';$('cfgModal').classList.add('open');
}
async function testCfg(){
  $('cfgTestRes').className='';$('cfgTestRes').textContent='测试中…';
  const r=await (await fetch('/api/config/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({baseUrl:$('cfgBase').value.trim(),apiKey:$('cfgKey').value.trim()||undefined,model:$('cfgModel').value.trim()})})).json();
  if(r.ok){$('cfgTestRes').className='ok';$('cfgTestRes').textContent=`✓ 连接成功（${r.latencyMs}ms${r.reply?' · '+r.reply:''}）`;}
  else{$('cfgTestRes').className='bad';$('cfgTestRes').textContent='✗ '+r.error;}
}
async function saveCfg(){
  const b={baseUrl:$('cfgBase').value.trim(),model:$('cfgModel').value.trim()};
  const k=$('cfgKey').value.trim();if(k)b.apiKey=k;
  const r=await (await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();
  if(r.error){$('cfgTestRes').className='bad';$('cfgTestRes').textContent='✗ '+r.error;return;}
  closeModal('cfgModal');refreshLlmPill();
}

/* ── 能力分享（社会化进化）── */
async function exportShare(){
  const r=await fetch('/api/share/export');
  const txt=await r.text();
  const name=`evo-agent-share-${new Date().toISOString().slice(0,10)}.json`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download=name;a.click();
  try{await navigator.clipboard.writeText(txt);alert(`能力包已下载并复制到剪贴板（${name}）\n发给其他人，对方在进化面板点「导入」即可使用你的能力`);}
  catch(_){alert(`能力包已下载（${name}）`);}
}
function openImport(){$('impRes').textContent='';$('impRes').className='';$('impText').value='';$('impFile').value='';$('impModal').classList.add('open');}
async function doImport(){
  const raw=$('impText').value.trim();
  if(!raw){$('impRes').className='bad';$('impRes').textContent='请粘贴能力包 JSON 或选择文件';return;}
  let pack;
  try{pack=JSON.parse(raw);}
  catch(e){$('impRes').className='bad';$('impRes').textContent='JSON 解析失败：'+e.message;return;}
  $('impRes').className='';$('impRes').textContent='导入中…';
  const r=await (await fetch('/api/share/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pack)})).json();
  if(!r.ok){$('impRes').className='bad';$('impRes').textContent='✗ '+r.error;return;}
  const parts=[];
  if(r.byType.skill)parts.push(`技能 ${r.byType.skill}（草稿，过门禁后生效）`);
  if(r.byType.memory)parts.push(`记忆 ${r.byType.memory}`);
  if(r.byType.experience)parts.push(`经验 ${r.byType.experience}`);
  $('impRes').className='ok';
  $('impRes').textContent=`✓ 导入成功：${parts.join('，')||'无新条目'}${r.skipped?`；跳过重复 ${r.skipped} 条`:''}${r.rejected?`；拒绝无效 ${r.rejected} 条`:''}`;
  refreshEvoPill();if(state.evoOpen)refreshEvo();
}

/* ── 进化面板 ── */
function openEvo(){state.evoOpen=!state.evoOpen;$('evoPanel').classList.toggle('open',state.evoOpen);if(state.evoOpen)refreshEvo();}
async function refreshEvo(){
  const s=await (await fetch('/api/state')).json();
  const spark=(arr)=>arr.length?`<div class="spark">${arr.map(v=>`<i style="height:${Math.max(4,Math.abs(v)*36+4)}px;${v<0?'background:var(--bad)':''}"></i>`).join('')}</div>`:'<div class="feed">暂无数据</div>';
  const rate=s.tasks.last20.length?Math.round(s.tasks.last20.reduce((a,b)=>a+b,0)/s.tasks.last20.length*100):null;
  $('evoPanel').innerHTML=`
  <h3>近 20 轮成功率</h3>
  <div class="big">${rate==null?'—':rate+'%'}<small>（全部 ${s.tasks.total} 轮：${s.tasks.allRate==null?'—':Math.round(s.tasks.allRate*100)+'%'}）</small></div>
  ${spark(s.tasks.last20)}
  <h3>已进化能力</h3>
  <div class="row"><span>技能（经门禁验证）</span><b>${s.entities.skill.count} 个 · 均Q ${s.entities.skill.avgQ??'—'}</b></div>
  <div class="row"><span>记忆</span><b>${s.entities.memory.count} 条 · 均Q ${s.entities.memory.avgQ??'—'}</b></div>
  <div class="row"><span>经验（带证据链）</span><b>${s.entities.experience.count} 条 · 均Q ${s.entities.experience.avgQ??'—'}</b></div>
  <div class="row"><span>黄金任务集</span><b>${s.golden} 条</b></div>
  ${s.tuned?`<h3>自动调参</h3><div class="row"><span>检索权重</span><b>${JSON.stringify(s.tuned)}</b></div>`:''}
  <h3>能力分享</h3>
  <div class="note">把自己的技能/记忆/经验打包分享给他人，或导入他人的能力包——多个 Agent 互相学习，共同进化。</div>
  <div class="sharebox">
    <button onclick="exportShare()">⬆ 导出能力包</button>
    <button onclick="openImport()">⬇ 导入能力包</button>
  </div>
  <h3>最近能力更新</h3>
  <div class="feed">${s.purify.recent.map(l=>`<div>[${new Date(l.at).toLocaleTimeString()}] ${esc(l.reason)}</div>`).join('')||'暂无'}</div>
  <h3>今日用量</h3>
  <div class="row"><span>tokens</span><b>${(s.usage.in+s.usage.out).toLocaleString()} / ${s.usage.budget.toLocaleString()}</b></div>`;
}
