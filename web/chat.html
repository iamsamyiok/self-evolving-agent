<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>evo-agent · 自进化智能体</title>
<style>
:root{--bg:#ffffff;--side:#f9f9f9;--panel:#f4f4f4;--line:#e5e5e5;--txt:#0d0d0d;--dim:#8f8f8f;--acc:#10a37f;--ok:#10a37f;--bad:#ef4444;--warn:#b45309;--chip:#f7f7f8;--userbub:#f4f4f4;--code:#f6f8fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
/* ── 侧栏：ChatGPT 式深色极简 ── */
aside.side{width:260px;background:var(--side);display:flex;flex-direction:column;flex-shrink:0;transition:margin-left .2s}
aside.side.collapsed{margin-left:-260px}
.brand{padding:14px 16px 6px;font-weight:600;font-size:14px;color:var(--txt)}
.brand small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:2px}
.newchat{margin:8px 12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--txt);font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.newchat:hover{background:var(--panel)}
#convs{flex:1;overflow-y:auto;padding:2px 8px}
.conv{padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--txt)}
.conv:hover{background:var(--panel)}
.conv.on{background:var(--panel)}
.conv .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .del{visibility:hidden;color:var(--dim);border:none;background:none;cursor:pointer;font-size:12px}
.conv:hover .del{visibility:visible}
/* 侧栏选中模式工具栏 */
.conv-toolbar{display:none;padding:4px 8px 2px;gap:4px}
.conv-toolbar.active{display:flex}
.conv-toolbar button{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer}
.conv-toolbar button:hover{border-color:var(--acc);color:var(--acc)}
.conv-toolbar button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.conv-toolbar button.primary:hover{filter:brightness(1.1)}
.conv input[type=checkbox]{accent-color:var(--acc);cursor:pointer}
/* 右键菜单 */
.ctx-menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 0;min-width:160px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.ctx-menu button{display:block;width:100%;text-align:left;padding:6px 14px;border:none;background:none;color:var(--txt);font-size:13px;cursor:pointer;white-space:nowrap}
.ctx-menu button:hover{background:var(--chip)}
.ctx-menu button.danger{color:var(--bad)}
.ctx-menu button.danger:hover{background:rgba(239,68,68,.1)}
.ctx-sep{height:1px;background:var(--line);margin:4px 0}
.conv.selected{outline:2px solid var(--acc);outline-offset:-2px}
/* 重命名输入框 */
.conv .rename-input{flex:1;background:transparent;border:1px solid var(--acc);border-radius:4px;color:var(--txt);padding:1px 4px;font-size:13px;outline:none}
.side-foot{border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.side-foot button{background:none;color:var(--txt);border:none;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.side-foot button:hover{background:var(--panel)}
#llmPill{font-size:11px;color:var(--dim);padding:4px 10px}
#llmPill b{color:var(--ok)}
/* ── 主区 ── */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg)}
#sidebarToggle{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;padding:4px 8px;border-radius:8px}
#sidebarToggle:hover{background:var(--panel);color:var(--txt)}
header h1{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:3px 10px;border-radius:12px;background:var(--chip);border:1px solid var(--line);color:var(--dim)}
.pill b{color:var(--acc)}
#messages{flex:1;overflow-y:auto;padding:24px 8px 8px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.msg{margin-bottom:26px;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
/* ChatGPT 式：用户右侧气泡 / AI 全宽无气泡 */
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bub{background:var(--userbub);border-radius:18px 18px 4px 18px;padding:11px 16px;max-width:75%;white-space:pre-wrap;font-size:15px;line-height:1.7}
.msg.ai{display:flex;gap:12px}
.ai-av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px}
.msg.ai .body{flex:1;min-width:0}
.msg.ai .bub{font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.msg.ai .bub code{background:var(--code);padding:1px 6px;border-radius:5px;font-family:Consolas,monospace;font-size:13px;color:#c7254e}
.msg.ai .bub pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0;white-space:pre;font-size:13px;color:#24292f}
/* 执行过程卡片：可折叠实时动作区 */
.exec{background:var(--chip);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.exec-h{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.exec-h .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);animation:pulse 1.2s infinite}
.exec.done .exec-h .dot{background:var(--ok);animation:none}
.exec.collapsed .exec-h .arrow{transform:rotate(-90deg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.exec-b{padding:2px 12px 10px;font-size:12px;color:var(--dim);line-height:2}
.exec.collapsed .exec-b{display:none}
.exec-b .ln{display:flex;gap:6px;align-items:baseline}
.exec-b .ln.done{color:#6b7f74}
.exec-b .ln.cur{color:var(--txt)}
.exec-b .ln .tick{color:var(--ok)}
.exec-b .ln .spin{display:inline-block;animation:pulse 1s infinite;color:var(--acc)}
.exec-b .prev{color:#7a7a7a;font-size:11px;margin-left:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%;display:block}
.exec-b .warn-ln{color:var(--warn)}
.exec-b .timer{margin-left:auto;font-size:11px;color:#9b9b9b;font-variant-numeric:tabular-nums}
/* 步骤内容折叠块 */
.step-block{border-top:1px solid var(--line);margin:4px 0 0}
.step-head{display:flex;align-items:center;gap:6px;padding:5px 2px;font-size:12px;color:var(--txt);cursor:pointer;user-select:none}
.step-head:hover{color:var(--acc)}
.step-head .arrow{font-size:10px;color:var(--dim);transition:transform .15s;flex-shrink:0}
.step-head .snum{font-size:11px;color:var(--dim);flex-shrink:0}
.step-head .sgoal{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-head .sstatus{font-size:11px;flex-shrink:0}
.step-body{padding:4px 8px 8px 22px;font-size:12px;color:var(--dim);line-height:1.75;white-space:pre-wrap;word-break:break-word;display:none;max-height:480px;overflow-y:auto;background:rgba(0,0,0,.04);border-radius:6px;margin:2px 0}
.step-body.open{display:block}
.step-body code{background:var(--code);padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:11px;color:#c7254e}
.step-body pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;margin:6px 0;white-space:pre;font-size:11px;color:#24292f}
.step-body pre code{background:transparent;padding:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:2px 9px;color:var(--dim);cursor:help}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}
.err{color:var(--bad);font-size:14px}
/* 输入区：ChatGPT 式大圆角输入框 + 圆形发送 */
footer{padding:8px 16px 16px;background:var(--bg)}
.inbox{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.inbox:focus-within{border-color:#c5c5d2}
.inbox-top{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;background:none;border:none;color:var(--txt);font-size:15px;font-family:inherit;resize:none;outline:none;max-height:180px;line-height:34px;padding:0} /* line-height=按钮高：单行时文字与两侧圆形按钮精确居中 */
#sendBtn,.attach-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--dim);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;margin-bottom:0}

/* 深度档位选择器（⚡/标准/深研） */
.depth-seg{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;flex-shrink:0;margin-bottom:0}
.depth-seg button{border:0;background:transparent;color:var(--dim);font-size:11px;padding:0 10px;height:30px;cursor:pointer;transition:all .15s}
.depth-seg button+button{border-left:1px solid var(--line)}
.depth-seg button.on{background:var(--acc);color:#fff;font-weight:600}

/* 引用上标（[n] → 可点击跳来源卡片） */
sup.cite{font-size:10px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:0 5px;margin:0 1px;color:var(--acc);cursor:pointer;vertical-align:super;white-space:nowrap}
sup.cite:hover{filter:brightness(1.15)}

/* 证据来源卡片 */
.src-list{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.src-title{font-size:11px;color:var(--dim);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.src-title .exp-btn{font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:1px 8px;cursor:pointer;color:var(--dim)}
.src-title .exp-btn:hover{color:var(--acc);border-color:var(--acc)}
.src-item{display:flex;gap:8px;align-items:baseline;font-size:12px;padding:3px 0;border-bottom:1px dotted var(--line)}
.src-item:last-child{border-bottom:0}
.src-item.click{cursor:pointer;border-radius:6px;padding:3px 4px}
.src-item.click:hover{background:var(--chip)}
.src-item.click:hover .src-t{color:var(--acc)}
.src-n{flex-shrink:0;color:var(--acc);font-weight:700;font-size:11px}
.src-t{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%}
.src-u{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.src-u a{color:var(--dim);text-decoration:none}
.src-u a:hover{color:var(--acc)}

/* 计划确认按钮组 */
.plan-confirm{display:flex;gap:8px;align-items:center;margin:6px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--chip)}
.plan-confirm .pc-txt{font-size:12px;color:var(--fg);flex:1}
.plan-confirm button{font-size:12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--fg);padding:4px 14px;cursor:pointer}
.plan-confirm button.pc-go{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.plan-confirm button.pc-stop{color:var(--bad)}
#sendBtn{background:var(--acc);border-color:var(--acc);color:#fff;font-size:17px}
#sendBtn:disabled{opacity:.35;cursor:default}
#sendBtn.stop{background:#666;border-color:#666;font-size:12px}
#sendBtn:not(:disabled):hover,.attach-btn:hover{filter:brightness(1.1);border-color:var(--acc)}
.attach-btn:hover{color:var(--acc)}
.img-preview{display:flex;flex-wrap:wrap;gap:6px;padding:0}
.img-preview:empty{display:none}
.img-preview .img-item{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.img-preview .img-item img{width:100%;height:100%;object-fit:cover}
.img-preview .img-item .remove{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.img-preview .img-item .remove:hover{background:rgba(239,68,68,.8)}
.hint{max-width:760px;margin:6px auto 0;text-align:center;font-size:11px;color:var(--dim)}
/* 欢迎页 */
#welcome{text-align:center;padding:48px 20px 0}
#welcome .logo{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
#welcome h2{font-size:24px;margin-bottom:8px;font-weight:600}
#welcome p{color:var(--dim);font-size:13px;margin-bottom:28px}
.exps{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:540px;margin:0 auto}
.exp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13px;cursor:pointer;text-align:left;color:var(--txt);transition:border-color .15s}
.exp:hover{border-color:var(--acc)}
.exp small{display:block;color:var(--dim);margin-top:4px;font-size:11px}
/* ── 进化面板 ── */
aside.evo{width:320px;background:var(--side);border-left:1px solid var(--line);overflow-y:auto;padding:16px;flex-shrink:0;display:none}
aside.evo.open{display:block}
aside.evo h3{font-size:12px;color:var(--dim);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px}
aside.evo h3:first-child{margin-top:0}
.evo .big{font-size:28px;font-weight:700}
.evo .big small{font-size:12px;color:var(--dim);font-weight:400}
.spark{display:flex;align-items:flex-end;gap:2px;height:36px;margin:6px 0}
.spark i{flex:1;background:var(--acc);min-height:2px;border-radius:1px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid #ececec}
.row b{color:var(--txt)}
.feed{font-size:11px;color:var(--dim);line-height:1.8}
.feed div{border-bottom:1px dashed #ececec;padding:3px 0}
.note{font-size:11px;color:var(--dim);background:var(--chip);border-radius:10px;padding:9px;line-height:1.7}
.sharebox{display:flex;gap:6px;margin-top:8px}
.sharebox button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font-size:12px}
.sharebox button:hover{border-color:var(--acc)}
/* ── 弹窗（配置/导入）── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50}
.modal.open{display:flex}
.mbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;width:440px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.mbox h2{font-size:16px;margin-bottom:4px}
.mbox p.sub{font-size:12px;color:var(--dim);margin-bottom:16px}
.mbox label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
.mbox input,.mbox textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:9px;font-size:13px}
.mbox input[type=checkbox]{width:auto;flex-shrink:0;accent-color:var(--acc)} /* 覆盖上面的 100% 拉伸：checkbox 保持原尺寸 */
.mbox textarea{min-height:120px;resize:vertical;font-family:Consolas,monospace;font-size:11px}
.mbtns{display:flex;gap:8px;margin-top:18px}
.mbtns button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--txt);cursor:pointer;font-size:13px}
.mbtns button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.mbtns button.primary:hover{filter:brightness(1.1)}
.mbtns button:hover{border-color:#c5c5d2}
#cfgTestRes,#impRes{font-size:12px;margin-top:10px;min-height:16px;line-height:1.6}
#cfgTestRes.ok,#impRes.ok{color:var(--ok)}#cfgTestRes.bad,#impRes.bad{color:var(--bad)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#d9d9e3;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#b9b9c7}
</style></head><body>
<div id="app">
  <aside class="side" id="sidebar">
    <div class="brand">♻ evo-agent<small>自进化智能体 · 越用越准</small></div>
    <button class="newchat" onclick="newConv()">✏ 新对话</button>
    <div id="convs"></div>
    <div class="conv-toolbar" id="convToolbar">
      <span style="font-size:11px;color:var(--dim);flex:1" id="selCount">已选 0 项</span>
      <button onclick="batchDeleteSelected()">删除所选</button>
      <button onclick="deleteAllConvs()" style="color:var(--bad)">全部删除</button>
      <button onclick="toggleSelMode()">取消</button>
    </div>
    <div class="side-foot">
      <div id="llmPill">检查配置中…</div>
      <button onclick="openEvo()">📈 进化面板</button>
      <button onclick="openCfg()">⚙ LLM 配置</button>
      <button onclick="toggleSelMode()" title="批量管理对话" style="font-size:11px;padding:2px 8px">批量管理</button>
    </div>
  </aside>

  <main>
    <header>
      <button id="sidebarToggle" onclick="toggleSidebar()" title="侧栏">☰</button>
      <h1 id="convTitle">新对话</h1>
      <span class="pill" id="evoPill" onclick="openEvo()" style="cursor:pointer">技能 <b>0</b> · 记忆 <b>0</b> · 经验 <b>0</b></span>
    </header>
    <div id="messages"><div class="wrap" id="msgWrap">
    </div></div>
    <footer>
      <div class="inbox">
        <div class="img-preview" id="imgPreview"></div>
        <div class="inbox-top">
          <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event)">
          <button class="attach-btn" onclick="document.getElementById('imgInput').click()" title="附带图片">＋</button>
          <textarea id="ta" rows="1" placeholder="输入消息…（可附带图片）"></textarea>
          <div class="depth-seg" id="depthSeg" title="深度档位：闪电=直答 · 标准=规划执行 · 深研=多源检索+缺口迭代+报告">
            <button data-d="light" aria-label="直答"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/></svg></button><button data-d="standard" class="on">标准</button><button data-d="deep">深研</button>
          </div>
          <button id="sendBtn" onclick="doSend()" title="发送">↑</button>
        </div>
      </div>
      <div class="hint">对话即任务 · 规划 → 执行 → 判定 → 沉淀进化</div>
    </footer>
  </main>

  <aside class="evo" id="evoPanel"></aside>

  <div class="modal" id="cfgModal" onclick="if(event.target===this)closeModal('cfgModal')">
    <div class="mbox">
      <h2>LLM 配置</h2>
      <p class="sub">OpenAI 兼容接口（DeepSeek / 智谱 / 通义 / 自建…），保存即生效</p>
      <label>Base URL</label>
      <input id="cfgBase" placeholder="https://api.deepseek.com/v1">
      <label>API Key <span id="cfgKeyMask"></span></label>
      <input id="cfgKey" type="password" placeholder="sk-…（留空保持不变）">
      <label>模型</label>
      <input id="cfgModel" placeholder="deepseek-chat">
      <div style="border-top:1px solid var(--line);margin:16px 0"></div>
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">工具箱（按需开启子功能，关闭后规划器不再分配对应工具）</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 14px">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
          <input type="checkbox" id="tbRuntime" onchange="_toolbox.runtime=this.checked"> 计算/代码执行
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
          <input type="checkbox" id="tbNetwork" onchange="_toolbox.network=this.checked"> 联网搜索
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
          <input type="checkbox" id="tbFileio" onchange="_toolbox.fileio=this.checked"> 沙箱文件读写
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
          <input type="checkbox" id="tbShell" onchange="_toolbox.shell=this.checked"> 命令行执行
        </label>
      </div>
      <div id="toolTipBox" style="font-size:12px;color:var(--dim);margin:6px 0 2px"></div>
      <div class="mbtns">
        <button onclick="testCfg()">测试连接</button>
        <button class="primary" onclick="saveCfg()">保存并启用</button>
      </div>
      <div id="cfgTestRes"></div>
    </div>
  </div>

  <div class="modal" id="impModal" onclick="if(event.target===this)closeModal('impModal')">
    <div class="mbox">
      <h2>导入能力包</h2>
      <p class="sub">粘贴他人分享的能力包 JSON（或选择文件），技能以草稿入库（须过黄金门禁才生效），记忆/经验去重后直接激活</p>
      <input type="file" id="impFile" accept=".json" style="margin-bottom:8px">
      <label>能力包内容</label>
      <textarea id="impText" placeholder='{"format":"evo-agent-share","items":[…]}'></textarea>
      <div class="mbtns">
        <button onclick="closeModal('impModal')">取消</button>
        <button class="primary" onclick="doImport()">导入</button>
      </div>
      <div id="impRes"></div>
    </div>
  </div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={convs:[],convId:null,sending:false,evoOpen:false,attachedImages:[],depth:localStorage.getItem('evo_depth')||'standard'};

/* ── markdown-lite ── */
function md(s){
  s=esc(s);
  // 已生成的 HTML 块（图片/代码）先暂存占位符，避免其中 URL 被下面的自动链接误包
  const slots=[];
  const stash=(h)=>{slots.push(h);return '\u0000'+(slots.length-1)+'\u0000';};
  // 图片 URL 渲染（base64 或 http/https）
  s=s.replace(/(!\[[^\]]*\]\(([^)]+)\))|((https?:\/\/[^\s<>"']+\.(?:png|jpg|jpeg|gif|png|webp)(\?[^\s<>"']*)?))/g, (m, fullImg, alt, url) => {
    const src = url || alt;
    const altText = alt ? alt.replace(/[*_`]/g, '') : '图片';
    return stash(`<img src="${src}" alt="${altText}" style="max-width:100%;max-height:400px;border-radius:8px;margin:8px 0;border:1px solid var(--line)" loading="lazy">`);
  });
  // markdown 链接 [文本](URL)：先于自动链接处理，渲染为文本可点的来源链接
  s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,txt,url)=>stash(`<a href="${url}" target="_blank" rel="noopener">${txt}</a>`));
  s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>stash('<pre>'+c.replace(/\n$/,'')+'</pre>'));
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>stash('<code>'+c+'</code>'));
  // 自动链接：正文裸 URL（含"链接：https://…"行）→ 可点击直达原始信息源（新标签打开；长链显示截断 href 保完整）
  s=s.replace(/(https?:\/\/[^\s\u0000<>"']+)/g,(u)=>{
    const disp=u.length>72?u.slice(0,69)+'…':u;
    return `<a href="${u}" target="_blank" rel="noopener">${disp}</a>`;
  });
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/^## (.+)$/gm,'<b style="font-size:15px">$1</b>');
  s=s.replace(/^### (.+)$/gm,'<b>$1</b>');
  s=s.replace(/^[-*] (.+)$/gm,'&bull; $1');
  s=s.replace(/\u0000(\d+)\u0000/g,(_,i)=>slots[Number(i)]);
  s=s.replace(/\n/g,'<br>');
  return s;
}

/* ── 外部链接打开兜底链 ──
 * 预览环境运行在平台 iframe 内：sandbox 未开 allow-popups 时 target=_blank 被静默拦截。
 * 统一走 openExternal：先试 window.open；被拦（返回 null）→ 试顶层窗口导航；
 * 顶层也跨域被拦 → 弹可复制提示，保证"来源"总能到达原始信息源。 */
function openExternal(ev,url){
  if(!/^https?:\/\//i.test(url))return; // 非外链（站内锚点等）放行原生行为
  try{if(ev)ev.preventDefault();}catch(_){}
  const w=window.open(url,'_blank','noopener,noreferrer');
  if(w)return false;
  try{window.top.location.href=url;return false;}catch(_){}
  prompt('当前预览环境阻止了直接打开外部链接，请复制以下地址到浏览器访问：',url);
  return false;
}

/* 全局委托：正文自动链接/markdown 链接统一走兜底链（沙箱 iframe 内直接点 a 可能无反应） */
document.addEventListener('click',(ev)=>{
  const a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null;
  if(!a)return;
  const href=a.getAttribute('href')||'';
  if(!/^https?:\/\//i.test(href))return;
  openExternal(ev,href);
},true);

/* ── 初始化 ── */
 async function init(){
  // 鉴权：包装 fetch 自动附加 Bearer；401 时引导输入令牌（服务端 SPA_AUTH_TOKEN 启用时）
  const _fetch=window.fetch.bind(window);
  window.fetch=async(input,init={})=>{
    const tk=localStorage.getItem('evo_token');
    const headers=new Headers(init.headers||{});
    if(tk&&!headers.has('Authorization'))headers.set('Authorization','Bearer '+tk);
    const res=await _fetch(input,{...init,headers});
    if(res.status===401&&!init.__retried){
      const t=prompt('访问受保护，请输入访问令牌（SPA_AUTH_TOKEN）：');
      if(t){localStorage.setItem('evo_token',t);return window.fetch(input,{...init,__retried:true});}
    }
    return res;
  };
  await refreshConvs();
  await refreshLlmPill();
  setInterval(refreshEvoPill,5000);
  // 深度档位选择器：持久化 + 三档互斥高亮
  const seg=$('depthSeg');
  const syncDepthUI=()=>{seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.d===state.depth));};
  seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.depth=b.dataset.d;localStorage.setItem('evo_depth',state.depth);syncDepthUI();});
  syncDepthUI();
  $('ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});
  $('ta').addEventListener('input',()=>{const t=$('ta');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px';});
  $('impFile').addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    $('impText').value=await f.text();
  });
}
async function refreshConvs(){
  state.convs=await (await fetch('/api/conversations')).json();
  $('convs').innerHTML=state.convs.map(c=>
    `<div class="conv ${c.id===state.convId?'on':''}" data-conv-id="${c.id}" onclick="loadConv('${c.id}');if(selMode){event.stopPropagation();toggleConvSel('${c.id}')"}">
      ${selMode?`<input type="checkbox" ${selectedConvs.has(c.id)?'checked':''} onclick="event.stopPropagation();toggleConvSel('${c.id}')">`:''}
      <span class="t" title="${esc(c.title)}">${esc(c.title)}</span>
      ${!selMode?`<button class="del" onclick="event.stopPropagation();delConv('${c.id}')" title="删除">✕</button>`:''}
    </div>`
  ).join('')||'<div style="color:var(--dim);font-size:12px;padding:12px">暂无对话</div>';
  updateSelCount();
}

let selMode = false, selectedConvs = new Set();

function toggleSelMode() {
  selMode = !selMode;
  selectedConvs.clear();
  document.querySelector('.conv-toolbar')?.classList.toggle('active', selMode);
  document.querySelectorAll('.conv').forEach(el => {
    el.classList.toggle('selected', false);
    const cb = el.querySelector('input[type=checkbox]');
    if (cb) cb.checked = false;
  });
  refreshConvs();
}

function toggleConvSel(id) {
  if (selectedConvs.has(id)) selectedConvs.delete(id);
  else selectedConvs.add(id);
  refreshConvs();
}

function updateSelCount() {
  $('selCount').textContent = `已选 ${selectedConvs.size} 项`;
}

async function batchDeleteSelected() {
  if (!selectedConvs.size) return;
  if (!confirm(`确定删除 ${selectedConvs.size} 个对话？`)) return;
  const ids = [...selectedConvs];
  await fetch('/api/conversations', {method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
  selectedConvs.clear();
  toggleSelMode();
  refreshConvs();
}

async function deleteAllConvs() {
  if (!confirm('确定删除所有对话？此操作不可恢复。')) return;
  const all = state.convs.map(c => c.id);
  if (!all.length) return;
  await fetch('/api/conversations', {method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids: all})});
  selectedConvs.clear();
  toggleSelMode();
  if (state.convId) newConv(); else refreshConvs();
}
async function refreshLlmPill(){
  const c=await (await fetch('/api/config')).json();
  $('llmPill').innerHTML=c.mock?'🧪 <b>MOCK 离线模式</b>':(c.configured?`✅ 已连接 <b>${esc(c.model)}</b>`:'⚠ 未配置 —— 点「LLM 配置」');
}
async function refreshEvoPill(){
  const s=await (await fetch('/api/state')).json();
  $('evoPill').innerHTML=`技能 <b>${s.entities.skill.count}</b> · 记忆 <b>${s.entities.memory.count}</b> · 经验 <b>${s.entities.experience.count}</b>`;
}

/* ── 会话 ── */
async function newConv(){state.convId=null;location.reload();}
async function loadConv(id){
  state.convId=id;
  const msgs=await (await fetch(`/api/conversations/${id}/messages`)).json();
  $('msgWrap').innerHTML='<div id="thread"></div>';
  for(const m of msgs)renderMsg(m);
  const conv=state.convs.find(c=>c.id===id);
  $('convTitle').textContent=conv?conv.title:'对话';
  refreshConvs();
}
async function delConv(id){await fetch(`/api/conversations/${id}`,{method:'DELETE'});if(state.convId===id)newConv();else refreshConvs();}
function closeModal(id){$(id).classList.remove('open');}

/* ── 消息渲染 ── */
function renderMsg(m){
  $('welcome')?.remove();
  const t=$('thread')||((el=>{el.id='thread';$('msgWrap').appendChild(el);return el;})(document.createElement('div')));
  if(m.role==='user'){
    const d=document.createElement('div');d.className='msg user';
    let html=`<div class="bub">`;
    if(m.images?.length){
      html+=m.images.map(src=>`<img src="${esc(src)}" style="max-width:200px;max-height:200px;border-radius:8px;margin:4px;border:1px solid var(--line)">`).join('');
    }
    html+=esc(m.content).replace(/\[图片 ×\d+\]\n?/g,'').replace(/\n/g,'<br>');
    html+=`</div>`;
    d.innerHTML=html;t.appendChild(d);
  }else{
    const d=document.createElement('div');d.className='msg ai';
    d.innerHTML=`<div class="ai-av">♻</div><div class="body">${aiHtml(m.meta?.thinkingHtml||m.meta?.thinking||'',m.content,m.meta)}</div>`;
    t.appendChild(d);
  }
  $('messages').scrollTop=$('messages').scrollHeight;
}
function aiHtml(thinking,content,meta){
  const m=meta||{};
  let chips='';
  const u=m.contextUsed||{skills:[],memories:[],experiences:[]};
  if(m.outcome)chips+=`<span class="chip ${m.outcome==='SUCCESS'?'ok':'bad'}" title="判定依据：${esc(m.basis)}">${m.outcome==='SUCCESS'?'✓ 完成':'✗ 失败'}</span>`;
  if(u.skills?.length)chips+=`<span class="chip" title="${esc(u.skills.map(x=>x.name+' (Q='+x.q+')').join('\n'))}">🛠 技能 ×${u.skills.length}</span>`;
  if(u.memories?.length)chips+=`<span class="chip" title="${esc(u.memories.map(x=>x.excerpt).join('\n'))}">🧠 记忆 ×${u.memories.length}</span>`;
  if(u.experiences?.length)chips+=`<span class="chip" title="${esc(u.experiences.map(x=>x.summary).join('\n'))}">📚 经验 ×${u.experiences.length}</span>`;
  if(m.quick)chips+='<span class="chip">⚡ 快速</span>';
  if(m.depth==='deep')chips+='<span class="chip" title="多路检索 · 缺口迭代 · 证据引用">🔍 深研</span>';
  if(m.durationMs!=null)chips+=`<span class="chip">${(m.durationMs/1000).toFixed(1)}s</span>`;
  const exec=thinking?`<div class="exec done"><div class="exec-h"><span class="dot"></span>执行过程</div><div class="exec-b">${thinking}</div></div>`:'';
  let body=m.error&&!content?`<span class="err">${esc(m.error)}</span>`:md(content);
  // 引用上标：[n] 仅在证据存在且序号有效时转换为可点击标记（跳转来源卡片）
  const ev=m.evidence||[];
  if(ev.length&&body){
    body=body.replace(/\[(\d{1,2})\]/g,(mm,n)=>{const i=Number(n);return i>=1&&i<=ev.length?`<sup class="cite" onclick="flashSrc(this,${i})">${n}</sup>`:mm;});
  }
  // 证据来源卡片 + 报告导出（深研交付物的可验证性载体）
  const normUrl=(u)=>(/^https?:\/\//i.test(u)?u:'https://'+u.replace(/^\/+/,''));
  const srcList=ev.length?`<div class="src-list" id="src-${m.taskId||''}">
    <div class="src-title"><span>来源（${ev.length} 条证据）</span><button class="exp-btn" onclick="exportReport(this)" data-task="${esc(m.taskId||'')}">⤓ 导出报告</button></div>
    ${ev.map(e=>{const u=e.url?normUrl(String(e.url)):'';return `<div class="src-item${u?' click':''}" id="srcn-${m.taskId||''}-${e.n}"${u?` onclick="if(event.target.closest&&event.target.closest('a'))return;openExternal(event,${esc(JSON.stringify(u))})"`:''}><span class="src-n">[${e.n}]</span><span class="src-t" title="${esc(e.title)}">${esc(e.title)}</span><span class="src-u">${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(e.source||u.slice(0,40))}</a>`:esc(e.source||'网络')}</span></div>`;}).join('')}
  </div>`:'';
  return `${exec}<div class="bub">${body}</div>${srcList}${chips?`<div class="meta">${chips}</div>`:''}`;
}

/* 引用上标 → 闪烁定位来源条目 */
function flashSrc(sup,n){
  const list=sup.closest('.body')?.querySelector('.src-list');
  const item=list?.querySelector(`.src-item:nth-child(${n+1})`)||list?.querySelectorAll('.src-item')[n-1];
  if(item){item.scrollIntoView({behavior:'smooth',block:'center'});item.style.background='var(--chip)';setTimeout(()=>{item.style.background='';},1200);}
}

/* 报告导出：回答 + 证据清单 → Markdown 文件下载（纯前端，零后端成本） */
function exportReport(btn){
  const bodyEl=btn.closest('.body');
  const bub=bodyEl?.querySelector('.bub');
  const srcList=bodyEl?.querySelectorAll('.src-item');
  const title=($('convTitle')?.textContent||'研究报告').trim();
  const lines=[`# ${title}`,'',`> 导出自 evo-agent · ${new Date().toLocaleString('zh-CN')}`,''];
  if(bub){
    // 剥离 sup.cite 标记保留 [n] 文本，代码块保留
    const clone=bub.cloneNode(true);
    clone.querySelectorAll('sup.cite').forEach(s=>s.replaceWith(`[${s.textContent}]`));
    clone.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
    clone.querySelectorAll('pre').forEach(p=>{p.replaceWith('\n```\n'+p.textContent+'\n```\n');});
    lines.push(clone.textContent.trim()
      .replace(/<b>(.*?)<\/b>/g,'**$1**')
      .replace(/^### (.+)$/gm,'### $1'),'');
  }
  if(srcList?.length){
    lines.push('## 来源','');
    srcList.forEach((it,i)=>{
      const n=it.querySelector('.src-n')?.textContent||`[${i+1}]`;
      const t=it.querySelector('.src-t')?.textContent||'';
      const u=it.querySelector('.src-u a')?.href||'';
      lines.push(`- ${n} ${t}${u?` — ${u}`:''}`);
    });
  }
  const blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`报告-${title.slice(0,20)}-${Date.now()}.md`;
  a.click();URL.revokeObjectURL(a.href);
}

/* ── 实时执行渲染器：行级 DOM 增量更新 + 每步内容折叠展示 ── */
function makeExecView(container){
  container.innerHTML=`<div class="exec"><div class="exec-h"><span class="arrow">▾</span><span class="dot"></span><span class="exec-title">正在思考…</span><span class="timer"></span></div><div class="exec-b" style="display:none"></div></div>`;
  const box=container.querySelector('.exec'),body=container.querySelector('.exec-b'),
        title=container.querySelector('.exec-title'),timerEl=container.querySelector('.timer');
  let curLine=null,curStart=0,timerId=null,elapsed=0,stepIdx=0;
  const scrollTop=()=>{const m=$('messages');m.scrollTop=m.scrollHeight;};
  const startTimer=()=>{curStart=Date.now();timerId=setInterval(()=>{timerEl.textContent=((Date.now()-curStart)/1000).toFixed(0)+'s';},500);};
  const stopTimer=()=>{if(timerId){clearInterval(timerId);timerId='';}timerEl.textContent=elapsed?((elapsed/1000).toFixed(1)+'s'):'';};
  box.querySelector('.exec-h').addEventListener('click',()=>box.classList.toggle('collapsed'));
  return {
    set(t){title.textContent=t;},
    plan(steps){
       body.style.display='';
       const d=document.createElement('div');d.className='ln';d.innerHTML=`<span class="tick">◇</span><span>规划：${esc(steps.map(s=>String(s).slice(0,26)).join(' → '))}</span>`;
       body.appendChild(d);this.cur("执行中…");scrollTop();
     },
    cur(label){
      if(curLine){this.finishLine();}
      body.style.display=''; // 首条进度行即展开面板（预检索/阶段事件不再藏在折叠区里）
      const d=document.createElement('div');d.className='ln cur';d.id='curln';
      d.innerHTML=`<span class="spin">●</span><span>${esc(label)}</span>`;
      body.appendChild(d);curLine=d;startTimer();scrollTop();
    },
    step(step){
      if(curLine){this.finishLine();}
      const idx=(step.idx??1);
      this.cur(`步骤 ${idx}/${step.total||'?'}：${step.goal}`);
    },
    stepDone(result){
      let lbl='';
      if(curLine){ // 行存在才完成行；行缺失（时序异常）也照常建折叠块，输出不丢
        curLine.className='ln done';
        lbl=curLine.querySelector('span:last-child').textContent;
        curLine.innerHTML=`<span class="tick">✓</span><span>${esc(lbl)}</span>`;
        curLine=null;if(timerId){clearInterval(timerId);timerId=null;}
      }
      // 创建折叠块
      const block=document.createElement('div');block.className='step-block';
      const outText=(result?.output||'').trim()||'（无输出）';
      const escapedOut=esc(outText.slice(0,8000));
      // 简单 md 格式化
      const htmlOut=escapedOut
        .replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
        .replace(/`([^`\n]+)`/g,'<code>$1</code>')
        .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
        .replace(/\n/g,'<br>');
      block.innerHTML=`
        <div class="step-head"><span class="arrow">▸</span><span class="snum">#${stepIdx+1}</span><span class="sgoal">${esc((result?.goal||lbl).slice(0,80))}</span><span class="sstatus" style="color:var(--dim)">展开</span></div>
        <div class="step-body">${htmlOut}</div>`;
      block.querySelector('.step-head').addEventListener('click',e=>{
        if(e.target.closest('.step-body'))return;
        const b=block.querySelector('.step-body');
        const open=b.classList.toggle('open');
        block.querySelector('.arrow').textContent=open?'▾':'▸';
        block.querySelector('.sstatus').textContent=open?'收起':'展开';
        block.querySelector('.sstatus').style.color=open?'var(--acc)':'var(--dim)';
      });
      const hdr=body.parentElement.querySelector('.exec-h');
      hdr.insertAdjacentElement('afterend',block);
      stepIdx++;
      scrollTop();
    },
    finishLine(){ // 完成当前行（cur/step 切换时调用；与 stepDone 的行完成逻辑一致，但不建折叠块）
      if(!curLine)return;
      curLine.className='ln done';
      const lbl=curLine.querySelector('span:last-child').textContent;
      curLine.innerHTML=`<span class="tick">✓</span><span>${esc(lbl)}</span>`;
      curLine=null;if(timerId){clearInterval(timerId);timerId=null;}
    },
    warn(t){const d=document.createElement('div');d.className='ln warn-ln';d.innerHTML=`<span>⚠</span><span>${esc(t)}</span>`;body.style.display='';body.appendChild(d);scrollTop();},
    info(emoji,t){const d=document.createElement('div');d.className='ln';d.innerHTML=`<span>${emoji}</span><span>${esc(t)}</span>`;body.style.display='';body.appendChild(d);scrollTop();},
    done(){this.stepDone();box.classList.remove('collapsed');title.textContent='执行过程';stopTimer();},
    html(){return body.style.display==='none'?'':`<div class="exec done"><div class="exec-h"><span class="dot"></span>执行过程</div><div class="exec-b">${body.innerHTML}</div></div>`;},
  };
}

/* ── 图片上传处理 ── */
function handleImageUpload(event){
  const files=[...event.target.files];
  event.target.value='';
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const dataUrl=e.target.result;
      state.attachedImages.push(dataUrl);
      const div=document.createElement('div');div.className='img-item';
      div.innerHTML=`<img src="${dataUrl}"><button class="remove" onclick="this.parentElement.remove()">✕</button>`;
      $('imgPreview').appendChild(div);
    };
    reader.readAsDataURL(f);
  });
}

/* ── 发送（NDJSON 流式 + 实时动作 + 断线恢复 + 可停止）── */
let activeAC=null; // 当前任务的 AbortController（停止时掐断 fetch 流）
let activeTaskId=null; // 当前活动 taskId（停止时通知后端协作式中断）
let userStopped=false; // 用户主动停止（区别于网络断流：停止后不再轮询恢复）
function setSendingUI(on){
  const b=$('sendBtn');
  b.disabled=false; // 发送中保持可点：点击即停止
  b.textContent=on?'■':'↑';
  b.title=on?'停止':'发送';
  b.classList.toggle('stop',on);
}
function stopActive(){
  if(!state.sending)return;
  userStopped=true;
  activeAC?.abort();
  if(activeTaskId)fetch('/api/task/'+activeTaskId+'/abort',{method:'POST'}).catch(()=>{});
}
async function doSend(){
  if(state.sending){stopActive();return;} // 发送中点击 = 停止
  const content=$('ta').value.trim();
  const images=[...state.attachedImages];
  state.attachedImages=[];
  $('imgPreview').innerHTML='';
  if(!content&&images.length===0)return;
  const displayContent=images.length?`[图片 ×${images.length}]\n${content||''}`:content;
  state.sending=true;$('ta').value='';$('ta').style.height='auto';
  setSendingUI(true);
  userStopped=false;activeTaskId=null;activeAC=new AbortController();
  renderMsg({role:'user',content:displayContent,images});
  $('welcome')?.remove();
  const d=document.createElement('div');d.className='msg ai';
  const wrap=($('thread')||(() =>{const el=document.createElement('div');el.id='thread';$('msgWrap').appendChild(el);return el;})());
  wrap.appendChild(d);
  d.innerHTML=`<div class="ai-av">♻</div><div class="body"></div>`;
  const body=d.querySelector('.body');
  const view=makeExecView(body);
  let meta={},taskId=null,handled=0; // handled：已渲染的进度事件数（轮询补渲染时跳过）
  let streamBub=null; // answer 打字机气泡（delta 事件增量写入；renderDone 时整体重写）
  const renderStage=(evt)=>{
    if(evt.stage==='start'){view.set('正在接收任务…');if(evt.taskId){taskId=evt.taskId;activeTaskId=evt.taskId;}}
    else if(evt.stage==='pre_search'){
      view.set(evt.parallel?'多路并行检索真实信息…':'预检索真实信息（规划前）…');
      if(evt.parallel&&evt.queries?.length)view.cur(`并行 ${evt.queries.length} 路检索：${evt.queries.map(q=>String(q).slice(0,16)).join(' / ')}…`);
      else view.cur('预检索：'+(String(evt.query||'').slice(0,48)+'…'));
    }
    else if(evt.stage==='phase'){
      // 阶段事件：每次 LLM 调用开始时上报（规划/检索查询生成/缺口检查/蒸馏/判定），行级计时让"在干啥"可见
      view.set((evt.label||'处理中')+'…');
      view.cur(evt.label||'处理中');
    }
    else if(evt.stage==='plan'){view.set('规划中…');view.plan(evt.steps);}
    else if(evt.stage==='plan_confirm'){
      // 计划确认窗口：用户放行/叫停（60s 超时自动继续）
      view.set('等待计划确认…');
      view.finishLine();
      const d=document.createElement('div');d.className='plan-confirm';
      d.innerHTML=`<span class="pc-txt">计划已生成——确认执行？<span style="color:var(--dim)">（60s 后自动继续）</span></span>
        <button class="pc-go">确认执行</button><button class="pc-stop">停止</button>`;
      const go=d.querySelector('.pc-go'),stopB=d.querySelector('.pc-stop');
      const settle=(ok)=>{go.disabled=stopB.disabled=true;d.style.opacity='.55';go.textContent=ok?'已确认，执行中…':'已停止';if(!ok)stopActive();};
      go.onclick=()=>{settle(true);if(activeTaskId)fetch('/api/task/'+activeTaskId+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"approve":true}'}).catch(()=>{});};
      stopB.onclick=()=>{settle(false);};
      body.appendChild(d);const m=$('messages');m.scrollTop=m.scrollHeight;
    }
    else if(evt.stage==='plan_confirmed'){if(evt.via==='auto')view.info('⏱','计划确认超时，自动继续执行');else view.info('✓','计划已确认，开始执行');}
    else if(evt.stage==='replan'){view.warn(`重新规划（第 ${evt.attempt} 次）：${evt.reason||''}`);}
    else if(evt.stage==='step'){view.set('执行中…');view.step(evt);}
    else if(evt.stage==='retry'){view.warn(`参数修正重试：${evt.error||''}`);}
    else if(evt.stage==='degrade'){view.warn(`「${evt.goal||''}」降级为自身推理（${evt.reason||''}）`);}
    else if(evt.stage==='step_done'){view.stepDone({goal:evt.goal||'',output:evt.output||evt.preview});}
    else if(evt.stage==='research_gap'){
      // 信息缺口叙事：用户看得懂"它为什么在补搜这个"
      view.finishLine();
      view.set('发现信息缺口，补充检索…');
      view.warn(`覆盖面检查（第 ${evt.round} 轮）：证据存在缺口 → 补搜「${(evt.gaps||[]).join('」「')}」`);
    }
    else if(evt.stage==='gap_ok'){view.finishLine();view.info('✓',`证据覆盖面检查通过（第 ${evt.round||1} 轮），信息充分`);}
    else if(evt.stage==='distilled'){view.finishLine();view.info('⤓',`步骤产出蒸馏：${evt.from??'?'} → ${evt.to??'?'} 字符（保要点/数字/来源）`);}
    else if(evt.stage==='answer'){view.set('综合回答中…');view.cur(evt.label||'综合回答');}
    else if(evt.stage==='delta'){
      // token 级打字机：首个 delta 建气泡，后续追加；完成后 renderDone 用 md 版整体重写
      if(!streamBub){view.finishLine();streamBub=document.createElement('div');streamBub.className='bub';streamBub.style.whiteSpace='pre-wrap';body.appendChild(streamBub);}
      streamBub.textContent+=String(evt.text||'');
      const m=$('messages');m.scrollTop=m.scrollHeight;
    }
    else if(evt.stage==='llm_wait'){
      // 限流/排队/生成心跳透明化：任务没死，模型还在工作（免费版 ~20 次/分钟）
      const sec=evt.waitSec??'?';
      const pos=evt.position??'?';
      view.set(evt.kind==='rate_limit'
        ?`服务限流，${sec}s 后自动重试（耐心 ${evt.nth}/${evt.max} 轮）`
        :evt.kind==='generating'
        ?`模型生成中… 已 ${sec}s（长回答属正常，非卡死）`
        :`排队等待模型配额（前方 ${pos} 个请求，已等 ${sec}s）…`);
    }
  };
  const renderDone=(q)=>{
    view.done();meta=q.meta||{};meta.thinkingHtml=view.html();streamBub=null;
    // 流式 done 事件载荷是 message.content；轮询恢复载荷是 result.answer——两者都兼容
    const answer=q.answer??q.content;
    body.innerHTML=aiHtml(view.html(),answer||('（任务失败：'+(q.error||'未知')+'）'),{...meta,outcome:q.outcome,basis:q.basis,durationMs:q.durationMs});
    $('messages').scrollTop=$('messages').scrollHeight;
    refreshEvoPill();
  };
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:state.convId,content,images,depth:state.depth}),signal:activeAC?.signal});
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line)continue;
        const evt=JSON.parse(line);
        if(evt.type==='ping'){/* 心跳保活，忽略 */}
        else if(evt.type==='conversation'){
          if(!state.convId){state.convId=evt.conversation.id;$('convTitle').textContent=evt.conversation.title;}
        }else if(evt.type==='stage'){
          try{renderStage(evt);handled++;}catch(re){view.warn('渲染异常：'+(re.message||re));handled++;}
        }else if(evt.type==='done'){
          renderDone(evt.message);
        }else if(evt.type==='error'){
          view.done();body.innerHTML=`<span class="err">⚠ ${esc(evt.error)}</span>`;
        }
      }
    }
  }catch(e){
    if(userStopped||e?.name==='AbortError'){
      // 用户主动停止：不轮询恢复，立即解锁输入
      view.done();
      body.innerHTML+='<div class="note" style="color:#8b8b8b;font-size:12px;padding:4px 0">已停止</div>';
    }else if(taskId){
      // 断流无感恢复：切轮询继续拿实时进度（服务端任务不受影响），补渲染漏掉的步骤。
      // 单次轮询失败只提示不退出（网络抖动不能放弃整个任务），直到拿到 done 或超时。
      view.set('同步执行进度…');
      const deadline=Date.now()+8*60*1000;
      let done=false;
      while(Date.now()<deadline&&!userStopped){
        await new Promise(r=>setTimeout(r,2500));
        try{
          const q=await (await fetch('/api/task/'+taskId)).json();
          if(Array.isArray(q.events)){
            for(const evt of q.events.slice(handled)){
              try{renderStage(evt);handled++;}catch(re){view.warn('渲染异常：'+(re.message||re));handled++;} // 单事件渲染失败不阻塞补渲染
            }
          }
          if(q.status==='done'){renderDone(q);done=true;break;}
          view.set('同步执行进度…');
        }catch(_){view.warn('恢复连接中…（'+(e.message||'连接中断')+'）');}
      }
      if(!done&&!userStopped){view.done();body.innerHTML='<span class="err">⚠ 同步超时：任务仍在后台执行，可稍后在对话列表中查看结果</span>';}
    }else{
      view.done();body.innerHTML=`<span class="err">网络错误：${esc(e.message)}</span>`;
    }
  }finally{
    // 无论正常完成、异常、还是用户停止：输入永远解锁，绝不锁死
    state.sending=false;setSendingUI(false);activeAC=null;activeTaskId=null;
    $('ta').focus();
    refreshConvs();
    if(state.evoOpen)refreshEvo();
  }
}

let _toolbox = { runtime: true, network: true, fileio: true, shell: true };
async function openCfg(){
  const c=await (await fetch('/api/config')).json();
  $('cfgBase').value=c.baseUrl||'';$('cfgModel').value=c.model||'';
  $('cfgKey').value='';$('cfgKeyMask').textContent=c.apiKeyMasked?`（当前 ${c.apiKeyMasked}）`:'';
  _toolbox = c.toolbox || _toolbox;
  syncToolboxUI();
  $('cfgTestRes').textContent='';$('cfgModal').classList.add('open');
}
async function testCfg(){
  $('cfgTestRes').className='';$('cfgTestRes').textContent='测试中…';
  const r=await (await fetch('/api/config/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({baseUrl:$('cfgBase').value.trim(),apiKey:$('cfgKey').value.trim()||undefined,model:$('cfgModel').value.trim()})})).json();
  if(r.ok){$('cfgTestRes').className='ok';$('cfgTestRes').textContent=`✓ 连接成功（${r.latencyMs}ms${r.reply?' · '+r.reply:''}）`;}
  else{$('cfgTestRes').className='bad';$('cfgTestRes').textContent='✗ '+r.error;}
}
async function saveCfg(){
  const b={baseUrl:$('cfgBase').value.trim(),model:$('cfgModel').value.trim(),toolbox:{..._toolbox}};
  const k=$('cfgKey').value.trim();if(k)b.apiKey=k;
  const r=await (await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();
  if(r.error){$('cfgTestRes').className='bad';$('cfgTestRes').textContent='✗ '+r.error;return;}
  _toolbox = r.toolbox || _toolbox;
  closeModal('cfgModal');refreshLlmPill();syncToolboxUI();
}
function syncToolboxUI(){
  const r=$('tbRuntime'),n=$('tbNetwork'),f=$('tbFileio'),s=$('tbShell');
  if(r){r.checked=!!_toolbox.runtime;n.checked=!!_toolbox.network;f.checked=!!_toolbox.fileio;s.checked=!!_toolbox.shell;}
}
function toolTip(el){el.title=_toolbox.runtime?'运行时/计算工具（calc、run_js）已启用，关闭则任务只能做搜索+推理，不能算/写码':''+(_toolbox.network?'网络工具（http_get）已启用，关闭则任务不能联网搜索':'')+(_toolbox.fileio?'文件读写/编辑已启用，关闭则任务不能读写沙箱文件':'')+(_toolbox.shell?'命令行执行已启用，关闭则任务不能执行 shell 命令':'')}

/* ── 能力分享（社会化进化）── */
async function exportShare(){
  const r=await fetch('/api/share/export');
  const txt=await r.text();
  const name=`evo-agent-share-${new Date().toISOString().slice(0,10)}.json`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download=name;a.click();
  try{await navigator.clipboard.writeText(txt);alert(`能力包已下载并复制到剪贴板（${name}）\n发给其他人，对方在进化面板点「导入」即可使用你的能力`);}
  catch(_){alert(`能力包已下载（${name}）`);}
}
function openImport(){$('impRes').textContent='';$('impRes').className='';$('impText').value='';$('impFile').value='';$('impModal').classList.add('open');}
async function doImport(){
  const raw=$('impText').value.trim();
  if(!raw){$('impRes').className='bad';$('impRes').textContent='请粘贴能力包 JSON 或选择文件';return;}
  let pack;
  try{pack=JSON.parse(raw);}
  catch(e){$('impRes').className='bad';$('impRes').textContent='JSON 解析失败：'+e.message;return;}
  $('impRes').className='';$('impRes').textContent='导入中…';
  const r=await (await fetch('/api/share/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pack)})).json();
  if(!r.ok){$('impRes').className='bad';$('impRes').textContent='✗ '+r.error;return;}
  const parts=[];
  if(r.byType.skill)parts.push(`技能 ${r.byType.skill}（草稿，过门禁后生效）`);
  if(r.byType.memory)parts.push(`记忆 ${r.byType.memory}`);
  if(r.byType.experience)parts.push(`经验 ${r.byType.experience}`);
  $('impRes').className='ok';
  $('impRes').textContent=`✓ 导入成功：${parts.join('，')||'无新条目'}${r.skipped?`；跳过重复 ${r.skipped} 条`:''}${r.rejected?`；拒绝无效 ${r.rejected} 条`:''}`;
  refreshEvoPill();if(state.evoOpen)refreshEvo();
}

/* ── 进化面板 ── */
function openEvo(){state.evoOpen=!state.evoOpen;$('evoPanel').classList.toggle('open',state.evoOpen);if(state.evoOpen)refreshEvo();}

  const s=await (await fetch('/api/state')).json();
  const spark=(arr)=>arr.length?`<div class="spark">${arr.map(v=>`<i style="height:${Math.max(4,Math.abs(v)*36+4)}px;${v<0?'background:var(--bad)':''}"></i>`).join('')}</div>`:'<div class="feed">暂无数据</div>';
  const rate=s.tasks.last20.length?Math.round(s.tasks.last20.reduce((a,b)=>a+b,0)/s.tasks.last20.length*100):null;
  $('evoPanel').innerHTML=`
  <h3>近 20 轮成功率</h3>
  <div class="big">${rate==null?'—':rate+'%'}<small>（全部 ${s.tasks.total} 轮：${s.tasks.allRate==null?'—':Math.round(s.tasks.allRate*100)+'%'}）</small></div>
  ${spark(s.tasks.last20)}
  <h3>已进化能力</h3>
  <div class="row"><span>技能（经门禁验证）</span><b>${s.entities.skill.count} 个 · 均Q ${s.entities.skill.avgQ??'—'}</b></div>
  <div class="row"><span>记忆</span><b>${s.entities.memory.count} 条 · 均Q ${s.entities.memory.avgQ??'—'}</b></div>
  <div class="row"><span>经验（带证据链）</span><b>${s.entities.experience.count} 条 · 均Q ${s.entities.experience.avgQ??'—'}</b></div>
  <div class="row"><span>黄金任务集</span><b>${s.golden} 条</b></div>
  ${s.tuned?`<h3>自动调参</h3><div class="row"><span>检索权重</span><b>${JSON.stringify(s.tuned)}</b></div>`:''}
  <h3>能力分享</h3>
  <div class="note">把自己的技能/记忆/经验打包分享给他人，或导入他人的能力包——多个 Agent 互相学习，共同进化。</div>
  <div class="sharebox">
    <button onclick="exportShare()">⬆ 导出能力包</button>
    <button onclick="openImport()">⬇ 导入能力包</button>
  </div>
  <h3>最近能力更新</h3>
  <div class="feed">${s.purify.recent.map(l=>`<div>[${new Date(l.at).toLocaleTimeString()}] ${esc(l.reason)}</div>`).join('')||'暂无'}</div>
  <h3>今日用量</h3>
  <div class="row"><span>tokens</span><b>${(s.usage.in+s.usage.out).toLocaleString()} / ${s.usage.budget.toLocaleString()}</b></div>`;
}

function toggleSidebar(){
  $('sidebar').classList.toggle('collapsed');
  localStorage.setItem('spa_sidebar_open',document.querySelector('aside.side').classList.contains('collapsed')?'0':'1');

// Context menu state
let ctxMenu = null;
let ctxConvId = null;

function showContextMenu(id, rect) {
  closeContextMenu();
  ctxConvId = id;
  const m = document.createElement('div');
  m.className = 'ctx-menu';
  m.innerHTML = `
    <button data-action="rename">✏ 重命名</button>
    <div class="ctx-sep"></div>
    <button data-action="delete" class="danger">🗑 删除对话</button>
  `;
  const x = rect ? rect.x : window.innerWidth / 2;
  const y = rect ? rect.y : window.innerHeight / 2;
  m.style.left = Math.min(x, window.innerWidth - 180) + 'px';
  m.style.top = Math.min(y, window.innerHeight - 100) + 'px';
  document.body.appendChild(m);
  ctxMenu = m;
  m.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { handleCtxAction(btn.dataset.action); closeContextMenu(); };
  });
}

function closeContextMenu() {
  if (ctxMenu) { ctxMenu.remove(); ctxMenu = null; ctxConvId = null; }
}

async function handleCtxAction(action) {
  if (!ctxConvId) return;
  if (action === 'rename') {
    const title = prompt('重命名对话：', '');
    if (title) {
      await fetch(`/api/conversations/${ctxConvId}/rename`, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});
      refreshConvs();
      if (state.convId === ctxConvId) loadConv(ctxConvId);
    }
  } else if (action === 'delete') {
    if (confirm('确定删除该对话？')) {
      await delConv(ctxConvId);
    }
  }
}

// Close on outside click
document.addEventListener('click', e => {
  if (ctxMenu && !ctxMenu.contains(e.target)) closeContextMenu();
});

// Add contextmenu listener to conv list
function initContextMenu() {
  document.getElementById('convs')?.addEventListener('contextmenu', e => {
    const el = e.target.closest('.conv');
    if (!el) return;
    e.preventDefault();
    const id = el.dataset.convId;
    showContextMenu(id, el.getBoundingClientRect());
  });
}

(function(){
  if(localStorage.getItem('spa_sidebar_open')==='0'){$('sidebar').classList.add('collapsed');}
})();

initContextMenu();
